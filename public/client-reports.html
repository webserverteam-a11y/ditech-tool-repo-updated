<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Reports — DiTech CDM</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 13px; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .cr-header {
      background: #1e2d5a;
      color: #fff;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      flex-wrap: wrap;
      gap: 8px;
    }
    .cr-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .cr-brand-sub {
      font-size: 0.85rem;
      opacity: 0.65;
      font-weight: 400;
      margin-left: 6px;
    }
    .cr-back-link {
      display: inline-flex; align-items: center; gap: 5px;
      color: rgba(255,255,255,0.75); text-decoration: none;
      font-size: 0.82rem; font-weight: 600; padding: 5px 10px;
      border: 1.5px solid rgba(255,255,255,0.25); border-radius: 6px;
      margin-right: 10px; transition: background 0.15s;
    }
    .cr-back-link:hover { background: rgba(255,255,255,0.1); }
    .cr-header-actions { display: flex; gap: 8px; align-items: center; }

    .cr-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 0.84rem; font-weight: 600; transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
    }
    .cr-btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.35); color: #fff; }
    .cr-btn-outline:hover { background: rgba(255,255,255,0.1); }
    .cr-btn-primary { background: #4f6ef7; color: #fff; }
    .cr-btn-primary:hover { background: #3b5be0; }
    .cr-btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
    .cr-btn-light { background: #f1f5f9; color: #334155; border: 1.5px solid #cbd5e1; }
    .cr-btn-light:hover { background: #e2e8f0; }
    .cr-btn-danger { background: #fff; color: #b91c1c; border: 1.5px solid #fecaca; }
    .cr-btn-danger:hover { background: #fef2f2; }

    /* ── Tabs ─────────────────────────────────────────────────── */
    .cr-tabs {
      background: #fff; border-bottom: 1px solid #e2e8f0;
      padding: 0 28px; display: flex; gap: 4px;
    }
    .cr-tab-btn {
      padding: 12px 16px; font-size: 0.85rem; font-weight: 700;
      color: #64748b; background: transparent; border: none; cursor: pointer;
      border-bottom: 2.5px solid transparent; margin-bottom: -1px;
      font-family: inherit; transition: color 0.15s, border-color 0.15s;
    }
    .cr-tab-btn:hover { color: #1e2d5a; }
    .cr-tab-btn.active { color: #1e2d5a; border-bottom-color: #4f6ef7; }

    /* ── Controls Bar ─────────────────────────────────────────── */
    .cr-controls {
      background: #fff; border-bottom: 1px solid #e2e8f0;
      padding: 12px 28px; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
    }
    .cr-ctrl-group { display: flex; flex-direction: column; gap: 4px; }
    .cr-ctrl-label {
      font-size: 0.72rem; font-weight: 700; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .cr-select, .cr-input {
      padding: 7px 32px 7px 10px; border: 1.5px solid #cbd5e1; border-radius: 7px;
      font-size: 0.86rem; font-weight: 500; color: #1e293b; background: #f8fafc;
      cursor: pointer; min-width: 160px; font-family: inherit;
    }
    .cr-select:focus, .cr-input:focus { outline: none; border-color: #4f6ef7; }
    .cr-input { padding: 7px 10px; cursor: text; min-width: 220px; }

    /* ── Report body ──────────────────────────────────────────── */
    .cr-body { padding: 20px 28px 40px; }
    .cr-view { display: none; }
    .cr-view.active { display: block; }

    /* ── KPI cards ────────────────────────────────────────────── */
    .cr-kpi-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 20px;
    }
    @media (max-width: 1100px) { .cr-kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .cr-kpi-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .cr-kpi-top { display: flex; align-items: center; justify-content: space-between; color: #64748b; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .cr-kpi-val { font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-top: 8px; }
    .cr-kpi-diff { font-size: 0.74rem; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f1f5f9; display: flex; align-items: center; gap: 4px; }
    .cr-kpi-diff.pos { color: #16a34a; }
    .cr-kpi-diff.neg { color: #dc2626; }

    /* ── Sections / cards ─────────────────────────────────────── */
    .cr-grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
    .cr-grid-2b { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 1000px) { .cr-grid-2, .cr-grid-2b { grid-template-columns: 1fr; } }
    .cr-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden;
    }
    .cr-card-hd { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .cr-card-hd h3 { font-size: 0.88rem; font-weight: 700; color: #1e293b; }
    .cr-card-hd p { font-size: 0.74rem; color: #94a3b8; margin-top: 2px; }
    .cr-card-body { padding: 14px 16px; }

    /* ── Trend chart ──────────────────────────────────────────── */
    .cr-legend { display: flex; gap: 14px; font-size: 0.72rem; font-weight: 700; }
    .cr-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .cr-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .cr-chart-labels { display: flex; margin-top: 4px; }
    .cr-chart-labels span { flex: 1; text-align: center; font-size: 0.68rem; color: #94a3b8; font-weight: 600; }

    /* ── Health status rows ───────────────────────────────────── */
    .cr-health-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid;
    }
    .cr-health-row.good { background: #f0fdf4; border-color: #bbf7d0; }
    .cr-health-row.bad { background: #fef2f2; border-color: #fecaca; }
    .cr-health-row.flat { background: #f8fafc; border-color: #e2e8f0; }
    .cr-health-label { font-size: 0.82rem; font-weight: 700; color: #1e293b; }
    .cr-health-sub { font-size: 0.7rem; font-weight: 600; }
    .cr-health-val { font-size: 1.25rem; font-weight: 800; }

    /* ── Leaderboard rows ─────────────────────────────────────── */
    .cr-lb-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 4px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
    }
    .cr-lb-row:hover { background: #f8fafc; }
    .cr-lb-row:last-child { border-bottom: none; }
    .cr-lb-name { font-size: 0.82rem; font-weight: 700; color: #1e293b; }
    .cr-lb-sub { font-size: 0.7rem; color: #94a3b8; }
    .cr-empty-note { padding: 18px 8px; text-align: center; color: #94a3b8; font-size: 0.8rem; font-style: italic; }

    /* ── Table ────────────────────────────────────────────────── */
    .cr-tbl-wrap { overflow-x: auto; }
    table.cr-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .cr-table thead tr { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    .cr-table thead th {
      padding: 8px 10px; text-align: left; font-weight: 700; color: #64748b;
      white-space: nowrap; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px;
      cursor: pointer; user-select: none;
    }
    .cr-table thead th:hover { color: #1e293b; }
    .cr-table thead th.num, .cr-table td.num { text-align: right; }
    .cr-table thead th.ctr, .cr-table td.ctr { text-align: center; }
    .cr-table tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
    .cr-table tbody tr:hover { background: #f8fafc; cursor: pointer; }
    .cr-table tbody tr:last-child { border-bottom: none; }
    .cr-table td { padding: 8px 10px; vertical-align: middle; color: #334155; }
    .cr-name-cell { font-weight: 800; color: #1e293b; }
    .cr-sub-cell { font-size: 0.72rem; color: #94a3b8; margin-top: 1px; }

    .cr-tier-badge { font-size: 0.65rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1px solid; margin-left: 6px; }
    .cr-tier-Enterprise { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
    .cr-tier-Growth { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .cr-tier-Starter { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }

    .cr-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
    .cr-badge.pos { background: #dcfce7; color: #15803d; }
    .cr-badge.neg { background: #fee2e2; color: #b91c1c; }
    .cr-badge.flat { background: #f1f5f9; color: #475569; }

    .cr-progress-track { width: 70px; height: 6px; background: #f1f5f9; border-radius: 4px; overflow: hidden; border: 1px solid #e2e8f0; margin-left: auto; margin-top: 3px; }
    .cr-progress-fill { height: 100%; background: #4f6ef7; }
    .cr-progress-fill.done { background: #16a34a; }

    /* Bulk entry inputs */
    .cr-cell-input {
      width: 100%; min-width: 78px; padding: 6px 6px; border: 1px solid #cbd5e1; border-radius: 5px;
      text-align: center; font-size: 0.8rem; font-weight: 700; color: #1e293b; background: #f8fafc; font-family: inherit;
    }
    .cr-cell-input:focus { outline: none; border-color: #4f6ef7; background: #fff; }
    .cr-prev-hint { display: block; text-align: center; font-size: 0.65rem; color: #94a3b8; margin-top: 3px; }
    .cr-notes-input { width: 100%; min-width: 160px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 0.78rem; font-family: inherit; }
    .cr-ctr-readout { display: block; text-align: center; font-weight: 800; color: #c2410c; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 5px; padding: 5px; }
    tr.cr-row-dirty { background: #fffbeb; }
    .cr-cell-pending { border-color: #f59e0b !important; background: #fff7e6 !important; }
    .cr-cell-conflict { border-color: #dc2626 !important; background: #fef2f2 !important; box-shadow: 0 0 0 2px rgba(220,38,38,0.15); }
    .cr-pending-note { padding: 8px 16px; font-size: 0.76rem; color: #92400e; background: #fffbeb; border-bottom: 1px solid #fde68a; }
    .cr-link-btn { background: none; border: none; padding: 0; color: #4f6ef7; font-weight: 700; cursor: pointer; font-size: inherit; text-decoration: underline; }
    .cr-dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; display: inline-block; margin-left: 5px; }

    /* ── Filters row ──────────────────────────────────────────── */
    .cr-filters-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
    .cr-quick-filters { display: inline-flex; gap: 2px; background: #f1f5f9; padding: 3px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .cr-quick-filters button {
      padding: 5px 12px; border-radius: 6px; border: none; background: transparent; cursor: pointer;
      font-size: 0.76rem; font-weight: 700; color: #64748b; font-family: inherit;
    }
    .cr-quick-filters button.active { background: #4f6ef7; color: #fff; }
    .cr-quick-filters button.active.growing { background: #16a34a; }
    .cr-quick-filters button.active.falling { background: #dc2626; }

    /* ── State box ────────────────────────────────────────────── */
    .cr-state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 50px 20px; color: #94a3b8; font-size: 0.85rem; }

    /* ── Toast ────────────────────────────────────────────────── */
    .cr-toast {
      position: fixed; bottom: 20px; right: 20px; background: #16a34a; color: #fff;
      padding: 11px 18px; border-radius: 8px; font-size: 0.82rem; font-weight: 700;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2); z-index: 500; display: none;
    }
    .cr-toast.error { background: #dc2626; }

    /* ── Modals ───────────────────────────────────────────────── */
    .cr-modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none;
      align-items: flex-start; justify-content: center; z-index: 300; padding: 30px 16px; overflow-y: auto;
    }
    .cr-modal-overlay.open { display: flex; }
    .cr-modal {
      background: #fff; border-radius: 12px; width: 100%; max-width: 560px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden;
    }
    .cr-modal.wide { max-width: 920px; }
    .cr-modal-hd { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .cr-modal-hd h3 { font-size: 1.02rem; font-weight: 800; color: #1e293b; }
    .cr-modal-hd .cr-modal-close { background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 1.3rem; line-height: 1; padding: 4px; }
    .cr-modal-hd .cr-modal-close:hover { color: #1e293b; }
    .cr-modal-body { padding: 18px 20px; max-height: 74vh; overflow-y: auto; }
    .cr-modal-ft { padding: 14px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: flex-end; gap: 10px; }

    .cr-form-row { margin-bottom: 12px; }
    .cr-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cr-form-row label { display: block; font-size: 0.74rem; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
    .cr-form-row input, .cr-form-row select {
      width: 100%; padding: 8px 10px; border: 1.5px solid #cbd5e1; border-radius: 7px;
      font-size: 0.86rem; color: #1e293b; font-family: inherit; background: #f8fafc;
    }
    .cr-form-row input:focus, .cr-form-row select:focus { outline: none; border-color: #4f6ef7; background: #fff; }

    .cr-detail-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
    @media (max-width: 700px) { .cr-detail-kpis { grid-template-columns: repeat(2, 1fr); } }
    .cr-detail-kpi { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
    .cr-detail-kpi span.lbl { font-size: 0.65rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; display: block; }
    .cr-detail-kpi span.val { font-size: 1.1rem; font-weight: 800; color: #1e293b; display: block; margin-top: 3px; }
    .cr-detail-kpi span.diff { font-size: 0.68rem; font-weight: 700; display: block; margin-top: 3px; }

    textarea.cr-csv-area {
      width: 100%; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 8px;
      font-family: 'Consolas', monospace; font-size: 0.75rem; color: #334155; resize: vertical;
    }

    @media (max-width: 900px) {
      .cr-controls, .cr-body, .cr-header, .cr-tabs { padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────── -->
<div class="cr-header">
  <div class="cr-brand">
    <a href="/" class="cr-back-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </a>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    DiTech CDM
    <span class="cr-brand-sub">/ Client Reports</span>
  </div>
  <div class="cr-header-actions">
    <button class="cr-btn cr-btn-outline" id="cr-btn-export" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export / Import
    </button>
    <button class="cr-btn cr-btn-primary" id="cr-btn-add-client" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Client
    </button>
  </div>
</div>

<!-- ── Tabs ────────────────────────────────────────────────────── -->
<div class="cr-tabs">
  <button class="cr-tab-btn active" data-tab="dashboard" type="button">Dashboard</button>
  <button class="cr-tab-btn" data-tab="clients" type="button">Clients</button>
  <button class="cr-tab-btn" data-tab="bulk" type="button">Bulk Entry</button>
</div>

<!-- ── Controls ────────────────────────────────────────────────── -->
<div class="cr-controls">
  <div class="cr-ctrl-group">
    <label class="cr-ctrl-label" for="cr-month-select">Reporting Month</label>
    <select class="cr-select" id="cr-month-select"></select>
  </div>
  <div class="cr-ctrl-group" style="justify-content:flex-end">
    <span style="font-size:0.75rem;color:#94a3b8" id="cr-summary-hint"></span>
  </div>
</div>

<!-- ── Body ────────────────────────────────────────────────────── -->
<div class="cr-body">

  <!-- Dashboard tab -->
  <div class="cr-view active" id="cr-view-dashboard"></div>

  <!-- Clients tab -->
  <div class="cr-view" id="cr-view-clients"></div>

  <!-- Bulk entry tab -->
  <div class="cr-view" id="cr-view-bulk"></div>

</div>

<!-- ── Client Detail Modal ─────────────────────────────────────── -->
<div class="cr-modal-overlay" id="cr-modal-detail">
  <div class="cr-modal wide" id="cr-modal-detail-content"></div>
</div>

<!-- ── Add / Edit Client Modal ─────────────────────────────────── -->
<div class="cr-modal-overlay" id="cr-modal-client">
  <div class="cr-modal" id="cr-modal-client-content"></div>
</div>

<!-- ── Export / Import Modal ───────────────────────────────────── -->
<div class="cr-modal-overlay" id="cr-modal-export">
  <div class="cr-modal" id="cr-modal-export-content"></div>
</div>

<div class="cr-toast" id="cr-toast"></div>

<script>
(function () {
  'use strict';

  /* ── Namespaced state ─────────────────────────────────────────── */
  var STATE = {
    clients: [],            // profile objects: {client, domain, industry, tier, accountManager, targetTraffic, targetLeads, startDate}
    metrics: {},            // { clientName: { monthKey: metricObj } }
    month: currentMonthKey(),
    tab: 'dashboard',
    search: '',
    filters: { manager: 'All Managers', tier: 'All Tiers', industry: 'All Industries', growth: 'all' },
    sortBy: 'traffic', sortDir: 'desc',
    // Unsaved edits, kept separately from DB data so a reload / another
    // user's save can never overwrite what this person has typed:
    //   { monthKey: { clientName: { field: { value, base, conflict } } } }
    // `base` = DB value when editing started (sent to the server for
    // conflict detection). Mirrored to localStorage so a refresh or crash
    // does not lose typed-but-unsaved data either.
    pending: {},
    saving: false,
    detailClient: null,
    editingClientName: null, // non-null while Add/Edit modal targets an existing client
    loaded: false,
  };

  /* ── Date / month helpers ─────────────────────────────────────── */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function currentMonthKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function prevMonthKey(mKey) {
    var parts = mKey.split('-');
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    m -= 1; if (m < 1) { m = 12; y -= 1; }
    return y + '-' + pad2(m);
  }
  function monthsList(count) {
    var d = new Date();
    var out = [];
    for (var i = 0; i < count; i++) {
      var y = d.getFullYear(), m = d.getMonth() + 1 - i;
      while (m < 1) { m += 12; y -= 1; }
      out.push(y + '-' + pad2(m));
    }
    return out;
  }
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatMonthName(mKey) {
    var p = mKey.split('-'); if (p.length < 2) return mKey;
    return MONTH_NAMES[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function formatShortMonth(mKey) {
    var p = mKey.split('-'); if (p.length < 2) return mKey;
    return MONTH_SHORT[parseInt(p[1], 10) - 1] + " '" + p[0].slice(2);
  }

  /* ── Number / metric helpers ─────────────────────────────────── */
  function formatNumber(n) { if (n === undefined || n === null || isNaN(n)) return '0'; return Number(n).toLocaleString('en-US'); }
  function formatPercent(v) { if (v === undefined || v === null || isNaN(v)) return '0%'; var p = v > 0 ? '+' : ''; return p + v.toFixed(1) + '%'; }
  function calcCTR(clicks, impressions) { if (!impressions || impressions <= 0) return 0; return Math.round((clicks / impressions) * 10000) / 100; }
  function diffCalc(cur, prev) {
    cur = cur || 0; prev = prev || 0;
    var diff = cur - prev;
    var pct = prev > 0 ? ((cur - prev) / prev) * 100 : (cur > 0 ? 100 : 0);
    return { current: cur, previous: prev, diff: diff, percentChange: Math.round(pct * 10) / 10 };
  }
  function zeroMetric(client, month) { return { client: client, month: month, organicTraffic: 0, organicClicks: 0, impressions: 0, ctr: 0, leads: 0, notes: '' }; }
  function metricFor(client, month) {
    var byMonth = STATE.metrics[client];
    return (byMonth && byMonth[month]) ? byMonth[month] : zeroMetric(client, month);
  }
  function buildComparison(client, month) {
    var cur = metricFor(client, month);
    var prev = metricFor(client, prevMonthKey(month));
    return {
      client: client, cur: cur, prev: prev,
      traffic: diffCalc(cur.organicTraffic, prev.organicTraffic),
      clicks: diffCalc(cur.organicClicks, prev.organicClicks),
      impressions: diffCalc(cur.impressions, prev.impressions),
      ctr: diffCalc(cur.ctr, prev.ctr),
      leads: diffCalc(cur.leads, prev.leads),
    };
  }
  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // Escapes a value, or shows an em dash when empty. (Passing the '&mdash;'
  // entity through esc() is what rendered the literal "&mdash;" text.)
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function escOrDash(str) {
    return (str === null || str === undefined || String(str).trim() === '') ? '&mdash;' : esc(str);
  }
  function clientProfile(name) {
    for (var i = 0; i < STATE.clients.length; i++) if (STATE.clients[i].client === name) return STATE.clients[i];
    return { client: name, domain: '', industry: '', tier: 'Growth', accountManager: '', targetTraffic: 0, targetLeads: 0, startDate: '' };
  }

  /* ── Toast ────────────────────────────────────────────────────── */
  var toastTimer = null;
  function showToast(msg, isError) {
    var el = document.getElementById('cr-toast');
    el.textContent = msg;
    el.className = 'cr-toast' + (isError ? ' error' : '');
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.style.display = 'none'; }, 3200);
  }

  /* ── API helpers ──────────────────────────────────────────────── */
  function apiGet(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function apiSend(method, url, body) {
    return fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
        return data;
      });
    });
  }

  /* ── Load all data ────────────────────────────────────────────── */
  function loadAll() {
    return Promise.all([
      apiGet('/api/client-reports/profiles'),
      apiGet('/api/client-reports/metrics')
    ]).then(function (results) {
      STATE.clients = results[0];
      var metricsFlat = results[1];
      var byClient = {};
      metricsFlat.forEach(function (m) {
        if (!byClient[m.client]) byClient[m.client] = {};
        byClient[m.client][m.month] = m;
      });
      STATE.metrics = byClient;
      STATE.loaded = true;
    });
  }

  // Reloads DB data and re-renders. Unsaved edits in STATE.pending are NOT
  // touched — the grid shows pending values on top of the fresh DB values.
  function reloadAndRender() {
    return loadAll().then(function () {
      renderCurrentTab();
    }).catch(function (e) {
      showToast('Failed to load data: ' + e.message, true);
    });
  }

  /* ── Pending (unsaved) edits ──────────────────────────────────── */
  var METRIC_FIELDS = ['organicTraffic', 'organicClicks', 'impressions', 'leads', 'notes'];
  var PENDING_KEY = 'crPendingEdits:v1';

  function loadPending() {
    try {
      var raw = localStorage.getItem(PENDING_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) { return {}; }
  }
  function persistPending() {
    try {
      if (pendingTotal() === 0) localStorage.removeItem(PENDING_KEY);
      else localStorage.setItem(PENDING_KEY, JSON.stringify(STATE.pending));
    } catch (e) { /* storage unavailable — edits still live in memory */ }
  }
  function hasDbRow(client, month) {
    return !!(STATE.metrics[client] && STATE.metrics[client][month]);
  }
  function dbValue(client, month, field) {
    var m = STATE.metrics[client] && STATE.metrics[client][month];
    if (m) return m[field];
    return field === 'notes' ? '' : 0;
  }
  function pendingRow(client, month) {
    return (STATE.pending[month] && STATE.pending[month][client]) || null;
  }
  function pendingField(client, month, field) {
    var row = pendingRow(client, month);
    return row && row[field] ? row[field] : null;
  }
  function draftValue(client, month, field) {
    var p = pendingField(client, month, field);
    return p ? p.value : dbValue(client, month, field);
  }
  function sameVal(field, a, b) {
    if (field === 'notes') return String(a == null ? '' : a) === String(b == null ? '' : b);
    return (Number(a) || 0) === (Number(b) || 0);
  }
  function setPending(client, month, field, value) {
    if (!STATE.pending[month]) STATE.pending[month] = {};
    var row = STATE.pending[month][client] || (STATE.pending[month][client] = {});
    var existing = row[field];
    var base = existing ? existing.base : dbValue(client, month, field);
    if (sameVal(field, value, base)) delete row[field];
    else row[field] = { value: value, base: base, conflict: false }; // editing again = conflict reviewed
    cleanupPending(client, month);
    persistPending();
  }
  function cleanupPending(client, month) {
    if (STATE.pending[month] && STATE.pending[month][client] && Object.keys(STATE.pending[month][client]).length === 0) delete STATE.pending[month][client];
    if (STATE.pending[month] && Object.keys(STATE.pending[month]).length === 0) delete STATE.pending[month];
  }
  function pendingClients(month) { return Object.keys(STATE.pending[month] || {}); }
  function pendingTotal() {
    var n = 0;
    Object.keys(STATE.pending).forEach(function (m) { n += Object.keys(STATE.pending[m] || {}).length; });
    return n;
  }
  function otherMonthsPending() {
    return Object.keys(STATE.pending).filter(function (m) { return m !== STATE.month && pendingClients(m).length > 0; }).sort();
  }

  /* ═══════════════════════════════════════════════════════════════
     DASHBOARD TAB
     ═══════════════════════════════════════════════════════════════ */
  function renderDashboard() {
    var el = document.getElementById('cr-view-dashboard');
    if (STATE.clients.length === 0) {
      el.innerHTML = '<div class="cr-card"><div class="cr-state-box">No clients yet. Click "Add Client" to start tracking SEO performance.</div></div>';
      return;
    }

    var comparisons = STATE.clients.map(function (c) { return buildComparison(c.client, STATE.month); });

    var totTrafficCur = 0, totTrafficPrev = 0, totClicksCur = 0, totClicksPrev = 0,
        totImprCur = 0, totImprPrev = 0, totLeadsCur = 0, totLeadsPrev = 0;
    comparisons.forEach(function (c) {
      totTrafficCur += c.traffic.current; totTrafficPrev += c.traffic.previous;
      totClicksCur += c.clicks.current; totClicksPrev += c.clicks.previous;
      totImprCur += c.impressions.current; totImprPrev += c.impressions.previous;
      totLeadsCur += c.leads.current; totLeadsPrev += c.leads.previous;
    });
    var trafficD = diffCalc(totTrafficCur, totTrafficPrev);
    var clicksD = diffCalc(totClicksCur, totClicksPrev);
    var imprD = diffCalc(totImprCur, totImprPrev);
    var leadsD = diffCalc(totLeadsCur, totLeadsPrev);
    var ctrCur = calcCTR(totClicksCur, totImprCur);
    var ctrPrev = calcCTR(totClicksPrev, totImprPrev);
    var ctrPtsDiff = Math.round((ctrCur - ctrPrev) * 100) / 100;

    var growing = comparisons.filter(function (c) { return c.traffic.diff > 0; });
    var falling = comparisons.filter(function (c) { return c.traffic.diff < 0; });
    var flat = comparisons.filter(function (c) { return c.traffic.diff === 0; });

    var topGrowth = comparisons.slice().sort(function (a, b) { return b.traffic.percentChange - a.traffic.percentChange; }).slice(0, 5);
    var topDrops = comparisons.filter(function (c) { return c.traffic.diff < 0; })
      .sort(function (a, b) { return a.traffic.percentChange - b.traffic.percentChange; }).slice(0, 5);

    var kpiHtml =
      kpiCard('Total Organic Traffic', formatNumber(trafficD.current), trafficD) +
      kpiCard('Organic Clicks', formatNumber(clicksD.current), clicksD) +
      kpiCard('Impressions', formatNumber(imprD.current), imprD, true) +
      kpiCardCtr(ctrCur, ctrPtsDiff) +
      kpiCard('Leads Received', formatNumber(leadsD.current), leadsD);

    var months6 = monthsList(6).reverse();
    var trafficSeries = [], leadsSeries = [];
    months6.forEach(function (mKey) {
      var t = 0, l = 0;
      STATE.clients.forEach(function (c) {
        var m = STATE.metrics[c.client] && STATE.metrics[c.client][mKey];
        if (m) { t += m.organicTraffic || 0; l += m.leads || 0; }
      });
      trafficSeries.push(t); leadsSeries.push(l);
    });

    var html = '<div class="cr-kpi-grid">' + kpiHtml + '</div>';
    html += '<div class="cr-grid-2">';

    html += '<div class="cr-card"><div class="cr-card-hd">' +
      '<div><h3>Organic Traffic & Leads Trajectory</h3><p>6-month trend across all ' + STATE.clients.length + ' clients</p></div>' +
      '<div class="cr-legend"><span><span class="cr-dot" style="background:#4f6ef7"></span>Organic Traffic</span>' +
      '<span><span class="cr-dot" style="background:#16a34a"></span>Leads Received</span></div>' +
      '</div><div class="cr-card-body">' +
      renderTrendChart(trafficSeries, leadsSeries) +
      '<div class="cr-chart-labels">' + months6.map(function (m) { return '<span>' + formatShortMonth(m) + '</span>'; }).join('') + '</div>' +
      '</div></div>';

    html += '<div class="cr-card"><div class="cr-card-hd"><div><h3>Portfolio Health</h3><p>' + formatMonthName(STATE.month) + ' MoM traffic distribution</p></div></div>' +
      '<div class="cr-card-body">' +
      healthRow('good', 'Growing Accounts', 'Positive MoM traffic', growing.length, STATE.clients.length) +
      healthRow('bad', 'Traffic Drops', 'Needs SEO review', falling.length, STATE.clients.length) +
      (flat.length > 0 ? healthRow('flat', 'Flat / Unchanged', 'No shift recorded', flat.length, STATE.clients.length) : '') +
      '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9;font-size:0.76rem;color:#64748b;display:flex;justify-content:space-between">' +
      '<span>Average leads / client</span><strong style="color:#16a34a">' + Math.round(totLeadsCur / (STATE.clients.length || 1)) + '/mo</strong></div>' +
      '</div></div>';

    html += '</div>';

    html += '<div class="cr-grid-2b">';
    html += '<div class="cr-card"><div class="cr-card-hd"><h3>Top MoM Growth Winners</h3></div><div class="cr-card-body">' +
      (topGrowth.length === 0 ? '<div class="cr-empty-note">No data yet for this month.</div>' :
        topGrowth.map(function (c) { return lbRow(c, true); }).join('')) +
      '</div></div>';
    html += '<div class="cr-card"><div class="cr-card-hd"><h3>Traffic Drops & Attention Required</h3></div><div class="cr-card-body">' +
      (topDrops.length === 0 ? '<div class="cr-empty-note">No clients dropped this month.</div>' :
        topDrops.map(function (c) { return lbRow(c, false); }).join('')) +
      '</div></div>';
    html += '</div>';

    el.innerHTML = html;

    el.querySelectorAll('[data-open-client]').forEach(function (node) {
      node.addEventListener('click', function () { openDetailModal(node.getAttribute('data-open-client')); });
    });
  }

  function kpiCard(label, valueStr, d, noArrowSign) {
    var cls = d.diff >= 0 ? 'pos' : 'neg';
    var arrow = d.diff >= 0 ? '&#9650;' : '&#9660;';
    return '<div class="cr-kpi-card"><div class="cr-kpi-top">' + esc(label) + '</div>' +
      '<div class="cr-kpi-val">' + valueStr + '</div>' +
      '<div class="cr-kpi-diff ' + cls + '">' + arrow + ' ' + formatNumber(Math.abs(d.diff)) + ' (' + formatPercent(d.percentChange) + ')</div>' +
      '</div>';
  }
  function kpiCardCtr(cur, ptsDiff) {
    var cls = ptsDiff >= 0 ? 'pos' : 'neg';
    return '<div class="cr-kpi-card"><div class="cr-kpi-top">Avg. CTR</div>' +
      '<div class="cr-kpi-val">' + cur.toFixed(2) + '%</div>' +
      '<div class="cr-kpi-diff ' + cls + '">' + (ptsDiff >= 0 ? '+' : '') + ptsDiff.toFixed(2) + ' pts</div></div>';
  }
  function healthRow(kind, label, sub, count, total) {
    var pct = total > 0 ? Math.round((count / total) * 100) : 0;
    var valColor = kind === 'good' ? '#15803d' : kind === 'bad' ? '#b91c1c' : '#475569';
    return '<div class="cr-health-row ' + kind + '"><div><span class="cr-health-label">' + esc(label) + '</span><br>' +
      '<span class="cr-health-sub" style="color:' + valColor + '">' + esc(sub) + '</span></div>' +
      '<div style="text-align:right"><span class="cr-health-val" style="color:' + valColor + '">' + count + '</span><br>' +
      '<span style="font-size:0.65rem;color:#94a3b8">' + pct + '% of portfolio</span></div></div>';
  }
  function lbRow(c, isGrowth) {
    var badgeCls = isGrowth ? 'pos' : 'neg';
    return '<div class="cr-lb-row" data-open-client="' + esc(c.client) + '">' +
      '<div><span class="cr-lb-name">' + esc(c.client) + '</span><br>' +
      '<span class="cr-lb-sub">' + (isGrowth ? '+' + c.traffic.diff.toLocaleString() : c.traffic.diff.toLocaleString()) + ' sessions &middot; ' + c.leads.current + ' leads</span></div>' +
      '<span class="cr-badge ' + badgeCls + '">' + formatPercent(c.traffic.percentChange) + '</span>' +
      '</div>';
  }

  function renderTrendChart(trafficArr, leadsArr) {
    var W = 900, H = 200, padL = 6, padR = 6, padT = 10, padB = 10;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var n = trafficArr.length;
    var maxT = Math.max(1, Math.max.apply(null, trafficArr));
    var maxL = Math.max(1, Math.max.apply(null, leadsArr));
    var stepX = n > 1 ? innerW / (n - 1) : 0;

    function ptsFor(arr, max) {
      var pts = [];
      for (var i = 0; i < n; i++) {
        var x = padL + stepX * i;
        var y = padT + innerH - (arr[i] / max) * innerH;
        pts.push([x, y]);
      }
      return pts;
    }
    var tPts = ptsFor(trafficArr, maxT);
    var lPts = ptsFor(leadsArr, maxL);
    function pathFor(pts) { return 'M' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L'); }
    var trafficLine = pathFor(tPts);
    var trafficArea = trafficLine + ' L' + (padL + innerW).toFixed(1) + ',' + (padT + innerH) + ' L' + padL + ',' + (padT + innerH) + ' Z';
    var leadsLine = pathFor(lPts);

    var circles = tPts.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="#4f6ef7"/>'; }).join('') +
      lPts.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="#16a34a"/>'; }).join('');

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:200px" preserveAspectRatio="none">' +
      '<path d="' + trafficArea + '" fill="#4f6ef7" fill-opacity="0.12" stroke="none"/>' +
      '<path d="' + trafficLine + '" fill="none" stroke="#4f6ef7" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="' + leadsLine + '" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>' +
      circles + '</svg>';
  }

  /* ═══════════════════════════════════════════════════════════════
     CLIENTS TABLE TAB
     ═══════════════════════════════════════════════════════════════ */
  function uniqueSorted(list) {
    var seen = {}; var out = [];
    list.forEach(function (v) { if (v && !seen[v]) { seen[v] = true; out.push(v); } });
    out.sort();
    return out;
  }

  function renderClientsTable() {
    var el = document.getElementById('cr-view-clients');
    var managers = uniqueSorted(STATE.clients.map(function (c) { return c.accountManager; }));
    var industries = uniqueSorted(STATE.clients.map(function (c) { return c.industry; }));

    var html = '<div class="cr-card">';
    html += '<div class="cr-filters-row">';
    html += '<div class="cr-ctrl-group" style="min-width:220px"><label class="cr-ctrl-label">Search</label>' +
      '<input class="cr-input" id="cr-cl-search" placeholder="Search client, domain, industry..." value="' + esc(STATE.search) + '"/></div>';

    html += '<div class="cr-quick-filters">' +
      quickFilterBtn('all', 'All (' + STATE.clients.length + ')') +
      quickFilterBtn('growing', 'Growing', 'growing') +
      quickFilterBtn('falling', 'Drops', 'falling') +
      '</div>';

    html += selectFilter('cr-cl-manager', 'Manager', ['All Managers'].concat(managers), STATE.filters.manager);
    html += selectFilter('cr-cl-tier', 'Tier', ['All Tiers', 'Enterprise', 'Growth', 'Starter'], STATE.filters.tier);
    html += selectFilter('cr-cl-industry', 'Industry', ['All Industries'].concat(industries), STATE.filters.industry);
    html += '</div>';

    var comparisons = STATE.clients.map(function (c) {
      var comp = buildComparison(c.client, STATE.month);
      comp.profile = c;
      return comp;
    });

    var searchLower = STATE.search.toLowerCase();
    var filtered = comparisons.filter(function (c) {
      var p = c.profile;
      var matchSearch = !searchLower || p.client.toLowerCase().indexOf(searchLower) !== -1 ||
        (p.domain || '').toLowerCase().indexOf(searchLower) !== -1 ||
        (p.industry || '').toLowerCase().indexOf(searchLower) !== -1;
      var matchManager = STATE.filters.manager === 'All Managers' || p.accountManager === STATE.filters.manager;
      var matchTier = STATE.filters.tier === 'All Tiers' || p.tier === STATE.filters.tier;
      var matchIndustry = STATE.filters.industry === 'All Industries' || p.industry === STATE.filters.industry;
      var matchGrowth = STATE.filters.growth === 'all' ||
        (STATE.filters.growth === 'growing' && c.traffic.diff > 0) ||
        (STATE.filters.growth === 'falling' && c.traffic.diff < 0);
      return matchSearch && matchManager && matchTier && matchIndustry && matchGrowth;
    });

    var dir = STATE.sortDir === 'desc' ? -1 : 1;
    filtered.sort(function (a, b) {
      switch (STATE.sortBy) {
        case 'name': return dir * a.profile.client.localeCompare(b.profile.client);
        case 'clicks': return dir * (a.clicks.current - b.clicks.current);
        case 'leads': return dir * (a.leads.current - b.leads.current);
        case 'growth': return dir * (a.traffic.percentChange - b.traffic.percentChange);
        case 'tier': return dir * a.profile.tier.localeCompare(b.profile.tier);
        default: return dir * (a.traffic.current - b.traffic.current);
      }
    });

    html += '<div class="cr-tbl-wrap"><table class="cr-table"><thead><tr>' +
      sortTh('name', 'Client') + '<th>Manager</th>' +
      sortTh('traffic', 'Organic Traffic', 'num') + sortTh('clicks', 'Clicks', 'num') +
      '<th class="num">Impressions</th><th class="ctr">CTR</th>' + sortTh('leads', 'Leads', 'num') +
      sortTh('growth', 'MoM Growth', 'ctr') + '</tr></thead><tbody>';

    if (filtered.length === 0) {
      html += '<tr><td colspan="8" class="cr-empty-note">No clients match the selected filters.</td></tr>';
    } else {
      filtered.forEach(function (c) {
        var p = c.profile;
        var leadProgress = Math.min(100, Math.round((c.leads.current / (p.targetLeads || 1)) * 100));
        var growthCls = c.traffic.percentChange > 0 ? 'pos' : c.traffic.percentChange < 0 ? 'neg' : 'flat';
        html += '<tr data-open-client="' + esc(p.client) + '">' +
          '<td><span class="cr-name-cell">' + esc(p.client) + '</span>' +
          '<span class="cr-tier-badge cr-tier-' + esc(p.tier) + '">' + esc(p.tier) + '</span>' +
          '<div class="cr-sub-cell">' + escOrDash(p.domain) + '</div></td>' +
          '<td>' + escOrDash(p.accountManager) + '</td>' +
          '<td class="num">' + formatNumber(c.traffic.current) + '<div class="cr-sub-cell" style="color:' + (c.traffic.diff >= 0 ? '#16a34a' : '#dc2626') + '">' + (c.traffic.diff >= 0 ? '+' : '') + formatNumber(c.traffic.diff) + '</div></td>' +
          '<td class="num">' + formatNumber(c.clicks.current) + '</td>' +
          '<td class="num">' + formatNumber(c.impressions.current) + '</td>' +
          '<td class="ctr">' + c.ctr.current.toFixed(2) + '%</td>' +

    html += '</tbody></table></div>';
    html += '<div style="padding:10px 16px;font-size:0.74rem;color:#64748b;border-top:1px solid #f1f5f9">Showing ' + filtered.length + ' of ' + STATE.clients.length + ' clients</div>';
    html += '</div>';

    el.innerHTML = html;

    // Wire up interactions
    var searchInput = document.getElementById('cr-cl-search');
    searchInput.addEventListener('input', function () { STATE.search = searchInput.value; renderClientsTable(); preserveFocus(searchInput); });
    document.getElementById('cr-cl-manager').addEventListener('change', function (e) { STATE.filters.manager = e.target.value; renderClientsTable(); });
    document.getElementById('cr-cl-tier').addEventListener('change', function (e) { STATE.filters.tier = e.target.value; renderClientsTable(); });
    document.getElementById('cr-cl-industry').addEventListener('change', function (e) { STATE.filters.industry = e.target.value; renderClientsTable(); });
    el.querySelectorAll('[data-quick-filter]').forEach(function (btn) {
      btn.addEventListener('click', function () { STATE.filters.growth = btn.getAttribute('data-quick-filter'); renderClientsTable(); });
    });
    el.querySelectorAll('th[data-sort]').forEach(function (th) {
      th.addEventListener('click', function () {
        var field = th.getAttribute('data-sort');
        if (STATE.sortBy === field) STATE.sortDir = STATE.sortDir === 'asc' ? 'desc' : 'asc';
        else { STATE.sortBy = field; STATE.sortDir = 'desc'; }
        renderClientsTable();
      });
    });
    el.querySelectorAll('tr[data-open-client]').forEach(function (row) {
      row.addEventListener('click', function () { openDetailModal(row.getAttribute('data-open-client')); });
    });
  }

  function preserveFocus(input) {
    var v = input.value;
    var pos = v.length;
    setTimeout(function () {
      var freshInput = document.getElementById(input.id);
      if (freshInput) { freshInput.focus(); freshInput.setSelectionRange(pos, pos); }
    }, 0);
  }
  function quickFilterBtn(val, label, cls) {
    var active = STATE.filters.growth === val;
    return '<button type="button" data-quick-filter="' + val + '" class="' + (active ? 'active ' + (cls || '') : '') + '">' + label + '</button>';
  }
  function selectFilter(id, label, options, current) {
    return '<div class="cr-ctrl-group"><label class="cr-ctrl-label">' + label + '</label>' +
      '<select class="cr-select" id="' + id + '">' +
      options.map(function (o) { return '<option value="' + esc(o) + '"' + (o === current ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
      '</select></div>';
  }
  function sortTh(field, label, extraCls) {
    var arrow = STATE.sortBy === field ? (STATE.sortDir === 'desc' ? ' &#9660;' : ' &#9650;') : '';
    return '<th data-sort="' + field + '" class="' + (extraCls || '') + '">' + esc(label) + arrow + '</th>';
  }

  /* ═══════════════════════════════════════════════════════════════
     BULK ENTRY TAB
     ═══════════════════════════════════════════════════════════════ */
  function renderBulkEntry() {
    var el = document.getElementById('cr-view-bulk');
    var month = STATE.month;
    var dirtyCount = pendingClients(month).length;
    var prevKey = prevMonthKey(month);
    var others = otherMonthsPending();

    var html = '<div class="cr-card">';
    html += '<div class="cr-card-hd">' +
      '<div><h3>Monthly Data Entry &mdash; ' + formatMonthName(month) + '</h3><p>CTR auto-calculates as you type clicks &amp; impressions. Grey numbers are ' + formatMonthName(prevKey) + ' (baseline). Only the cells you change are saved.</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="cr-btn cr-btn-light" id="cr-bulk-copy-baseline" type="button" title="Fills only clients that have no ' + esc(formatMonthName(month)) + ' data yet">Copy Last Month (empty rows)</button>' +
      '<button class="cr-btn cr-btn-light" id="cr-bulk-discard" type="button" ' + (dirtyCount === 0 ? 'disabled' : '') + '>Discard Changes</button>' +
      '<button class="cr-btn cr-btn-primary" id="cr-bulk-save" type="button" ' + (dirtyCount === 0 || STATE.saving ? 'disabled' : '') + '>Save All (' + dirtyCount + ' pending)</button>' +
      '</div></div>';

    if (others.length) {
      html += '<div class="cr-pending-note">Unsaved edits are also waiting in: ' +
        others.map(function (m) { return '<button type="button" class="cr-link-btn" data-goto-month="' + m + '">' + formatMonthName(m) + ' (' + pendingClients(m).length + ')</button>'; }).join(', ') +
        '</div>';
    }

    html += '<div class="cr-tbl-wrap"><table class="cr-table"><thead><tr>' +
      '<th>Client</th><th class="num">Organic Traffic</th><th class="num">Organic Clicks</th>' +
      '<th class="num">Impressions</th><th class="ctr">CTR</th><th class="num">Leads</th>' +
      '<th class="ctr">MoM Shift</th><th>Notes</th></tr></thead><tbody>';

    if (STATE.clients.length === 0) {
      html += '<tr><td colspan="8" class="cr-empty-note">No clients yet.</td></tr>';
    } else {
      STATE.clients.forEach(function (c) {
        var name = c.client;
        var row = pendingRow(name, month) || {};
        var exists = hasDbRow(name, month);
        var isDirty = Object.keys(row).length > 0;
        var prevMetric = metricFor(name, prevKey);
        var trafficDiff = diffCalc(draftValue(name, month, 'organicTraffic'), prevMetric.organicTraffic);
        var badgeCls = trafficDiff.diff > 0 ? 'pos' : trafficDiff.diff < 0 ? 'neg' : 'flat';
        var ctr = calcCTR(draftValue(name, month, 'organicClicks'), draftValue(name, month, 'impressions'));

        function numCell(field, prevHint) {
          var p = row[field];
          var val = (p || exists) ? String(draftValue(name, month, field)) : '';
          var cls = 'cr-cell-input' + (p ? ' cr-cell-pending' : '') + (p && p.conflict ? ' cr-cell-conflict' : '');
          var title = p && p.conflict ? ' title="Someone else saved ' + esc(formatNumber(p.base)) + ' here while you were editing. Save again to keep your value."' : '';
          return '<td><input class="' + cls + '"' + title + ' type="number" min="0" data-field="' + field + '" value="' + esc(val) + '" placeholder="' + (exists ? '' : esc(prevMetric[field] || '')) + '"/>' +
            '<span class="cr-prev-hint">' + prevHint + '</span></td>';
        }
        var notesP = row.notes;
        var notesCls = 'cr-notes-input' + (notesP ? ' cr-cell-pending' : '') + (notesP && notesP.conflict ? ' cr-cell-conflict' : '');
        var notesTitle = notesP && notesP.conflict ? ' title="Someone else saved: ' + esc(notesP.base) + '"' : '';

        html += '<tr class="' + (isDirty ? 'cr-row-dirty' : '') + '" data-client="' + esc(name) + '">' +
          '<td><span class="cr-name-cell">' + esc(name) + (isDirty ? '<span class="cr-dirty-dot"></span>' : '') + '</span>' +
          '<div class="cr-sub-cell">Mgr: ' + escOrDash(c.accountManager) + (exists ? '' : ' &middot; <em>no data yet</em>') + '</div></td>' +
          numCell('organicTraffic', 'Prev: ' + formatNumber(prevMetric.organicTraffic)) +
          numCell('organicClicks', 'Prev: ' + formatNumber(prevMetric.organicClicks)) +
          numCell('impressions', 'Prev: ' + formatNumber(prevMetric.impressions)) +
          '<td><span class="cr-ctr-readout" data-ctr-readout>' + ctr.toFixed(2) + '%</span>' +
          '<span class="cr-prev-hint">Prev: ' + prevMetric.ctr.toFixed(2) + '%</span></td>' +
          numCell('leads', 'Prev: ' + prevMetric.leads + ' / Tgt: ' + c.targetLeads) +
          '<td class="ctr"><span class="cr-badge ' + badgeCls + '">' + formatPercent(trafficDiff.percentChange) + '</span></td>' +
          '<td><input class="' + notesCls + '"' + notesTitle + ' type="text" data-field="notes" value="' + esc(draftValue(name, month, 'notes') || '') + '" placeholder="Work done this month..."/></td>' +
          '</tr>';
      });
    }
    html += '</tbody></table></div>';
    html += '<div style="padding:10px 16px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center">' +
      '<span id="cr-bulk-counter" style="font-size:0.76rem;color:#64748b">' + dirtyCount + ' client row(s) modified</span>' +
      '<button class="cr-btn cr-btn-primary" id="cr-bulk-save-bottom" type="button" ' + (dirtyCount === 0 || STATE.saving ? 'disabled' : '') + '>Save All Updates</button>' +
      '</div></div>';

    el.innerHTML = html;

    el.querySelectorAll('input[data-field]').forEach(function (input) {
      input.addEventListener('input', function () { handleBulkInputChange(input); });
    });
    el.querySelectorAll('[data-goto-month]').forEach(function (btn) {
      btn.addEventListener('click', function () { setMonth(btn.getAttribute('data-goto-month')); });
    });
    var copyBtn = document.getElementById('cr-bulk-copy-baseline');
    if (copyBtn) copyBtn.addEventListener('click', copyLastMonthBaseline);
    var discardBtn = document.getElementById('cr-bulk-discard');
    if (discardBtn) discardBtn.addEventListener('click', discardBulkChanges);
    ['cr-bulk-save', 'cr-bulk-save-bottom'].forEach(function (id) {
      var btn = document.getElementById(id);
      if (btn) btn.addEventListener('click', saveBulkEntry);
    });
  }

  function handleBulkInputChange(input) {
    var row = input.closest('tr');
    var client = row.getAttribute('data-client');
    var field = input.getAttribute('data-field');
    var month = STATE.month;

    if (field === 'notes') {
      setPending(client, month, field, input.value);
    } else if (input.value.trim() === '' && !hasDbRow(client, month)) {
      // Clearing a cell on a month that has no saved data = "nothing to save"
      if (STATE.pending[month] && STATE.pending[month][client]) delete STATE.pending[month][client][field];
      cleanupPending(client, month);
      persistPending();
    } else {
      setPending(client, month, field, Math.max(0, parseInt(input.value, 10) || 0));
    }

    var p = pendingField(client, month, field);
    input.classList.toggle('cr-cell-pending', !!p);
    input.classList.remove('cr-cell-conflict');
    input.removeAttribute('title');

    if (field === 'organicClicks' || field === 'impressions') {
      var ctrCell = row.querySelector('[data-ctr-readout]');
      if (ctrCell) ctrCell.textContent = calcCTR(draftValue(client, month, 'organicClicks'), draftValue(client, month, 'impressions')).toFixed(2) + '%';
    }
    if (field === 'organicTraffic') {
      var prevMetric = metricFor(client, prevMonthKey(month));
      var trafficDiff = diffCalc(draftValue(client, month, 'organicTraffic'), prevMetric.organicTraffic);
      var badge = row.querySelector('.cr-badge');
      if (badge) {
        badge.className = 'cr-badge ' + (trafficDiff.diff > 0 ? 'pos' : trafficDiff.diff < 0 ? 'neg' : 'flat');
        badge.textContent = formatPercent(trafficDiff.percentChange);
      }
    }

    var isDirty = !!pendingRow(client, month);
    row.classList.toggle('cr-row-dirty', isDirty);
    var nameCell = row.querySelector('.cr-name-cell');
    var dot = nameCell && nameCell.querySelector('.cr-dirty-dot');
    if (isDirty && nameCell && !dot) {
      dot = document.createElement('span'); dot.className = 'cr-dirty-dot'; nameCell.appendChild(dot);
    } else if (!isDirty && dot) {
      dot.parentNode.removeChild(dot);
    }
    updateBulkSaveButtons();
  }

  function updateBulkSaveButtons() {
    var count = pendingClients(STATE.month).length;
    ['cr-bulk-save', 'cr-bulk-save-bottom'].forEach(function (id) {
      var btn = document.getElementById(id);
      if (!btn) return;
      btn.disabled = count === 0 || STATE.saving;
      btn.textContent = STATE.saving ? 'Saving…' : (id === 'cr-bulk-save' ? 'Save All (' + count + ' pending)' : 'Save All Updates');
    });
    var discardBtn = document.getElementById('cr-bulk-discard');
    if (discardBtn) discardBtn.disabled = count === 0 || STATE.saving;
    var counter = document.getElementById('cr-bulk-counter');
    if (counter) counter.textContent = count + ' client row(s) modified';
  }

  // Only fills clients that have NO data saved for this month yet (and no
  // unsaved edits) — it must never overwrite numbers someone already entered.
  function copyLastMonthBaseline() {
    var month = STATE.month;
    var prevKey = prevMonthKey(month);
    var filled = 0;
    STATE.clients.forEach(function (c) {
      var prev = STATE.metrics[c.client] && STATE.metrics[c.client][prevKey];
      if (!prev || hasDbRow(c.client, month) || pendingRow(c.client, month)) return;
      ['organicTraffic', 'organicClicks', 'impressions', 'leads'].forEach(function (f) {
        setPending(c.client, month, f, prev[f] || 0);
      });
      if (pendingRow(c.client, month)) filled++;
    });
    if (filled === 0) { showToast('Nothing to copy — every client with ' + formatMonthName(prevKey) + ' data already has ' + formatMonthName(month) + ' data or edits.', true); return; }
    showToast('Copied ' + formatMonthName(prevKey) + ' numbers into ' + filled + ' empty row(s). Review, then Save.');
    renderBulkEntry();
  }

  function discardBulkChanges() {
    var count = pendingClients(STATE.month).length;
    if (!count) return;
    if (!window.confirm('Discard unsaved changes for ' + count + ' client(s) in ' + formatMonthName(STATE.month) + '?')) return;
    delete STATE.pending[STATE.month];
    persistPending();
    renderBulkEntry();
  }

  function saveBulkEntry() {
    if (STATE.saving) return;
    var month = STATE.month;
    var clients = pendingClients(month);
    if (clients.length === 0) return;

    var sent = {};
    var payload = clients.map(function (client) {
      var row = STATE.pending[month][client];
      var item = { client: client, month: month, base: {} };
      sent[client] = {};
      Object.keys(row).forEach(function (f) {
        item[f] = row[f].value;
        item.base[f] = row[f].base;
        sent[client][f] = row[f].value;
      });
      return item;
    });

    STATE.saving = true;
    updateBulkSaveButtons();
    apiSend('PUT', '/api/client-reports/metrics', payload).then(function (res) {
      var conflicts = res.conflicts || [];
      var conflictMap = {};
      conflicts.forEach(function (c) { conflictMap[c.client + '\u0000' + c.field] = c; });
      Object.keys(sent).forEach(function (client) {
        Object.keys(sent[client]).forEach(function (f) {
          var p = pendingField(client, month, f);
          if (!p) return;
          var c = conflictMap[client + '\u0000' + f];
          if (c) { p.base = c.theirs; p.conflict = true; return; }
          if (sameVal(f, p.value, sent[client][f])) delete STATE.pending[month][client][f];
          else p.base = sent[client][f]; // typed again while saving — keep the newer edit
        });
        cleanupPending(client, month);
      });
      persistPending();
      showToast(res.message || 'Saved successfully', conflicts.length > 0);
      STATE.saving = false;
      return reloadAndRender();
    }).catch(function (e) {
      STATE.saving = false;
      updateBulkSaveButtons();
      showToast('Save failed — your edits are kept, try again: ' + e.message, true);
    });
  }

      '<div class="cr-detail-kpi"><span class="lbl">Leads</span><span class="val">' + comp.leads.current + '</span><span class="diff" style="color:#94a3b8">Target: ' + p.targetLeads + ' (' + Math.round((comp.leads.current / (p.targetLeads || 1)) * 100) + '%)</span></div>' +
      '</div>';

      html += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:0.78rem;color:#334155;margin-bottom:14px"><strong>Notes:</strong> ' + esc(comp.cur.notes) + '</div>';
    }

  function detailKpi(label, valueStr, d) {
    var cls = d.diff >= 0 ? '#16a34a' : '#dc2626';
    return '<div class="cr-detail-kpi"><span class="lbl">' + esc(label) + '</span><span class="val">' + valueStr + '</span>' +
      '<span class="diff" style="color:' + cls + '">' + (d.diff >= 0 ? '+' : '') + formatNumber(d.diff) + ' (' + formatPercent(d.percentChange) + ')</span></div>';
  }

  // `keep` (optional) = { field: value } the user typed that hit a conflict —
  // re-shown in red on top of the fresh DB values so nothing typed is lost.
  function toggleDetailEditForm(keep) {
    var container = document.getElementById('cr-detail-edit-form');
    if (container.innerHTML.trim() && !keep) { container.innerHTML = ''; return; }
    var client = STATE.detailClient;
    var month = STATE.month;
    var base = clone(metricFor(client, month)); // what the user sees when editing starts
    keep = keep || {};
    var shown = {};
    METRIC_FIELDS.forEach(function (f) { shown[f] = Object.prototype.hasOwnProperty.call(keep, f) ? keep[f] : base[f]; });

    var ids = { organicTraffic: 'df-traffic', organicClicks: 'df-clicks', impressions: 'df-impressions', leads: 'df-leads', notes: 'df-notes' };
    var html = '<form id="cr-detail-form" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:14px">' +
      '<div class="cr-form-grid">' +
      formField('df-traffic', 'Organic Traffic', 'number', shown.organicTraffic) +
      formField('df-clicks', 'Organic Clicks', 'number', shown.organicClicks) +
      formField('df-impressions', 'Impressions', 'number', shown.impressions) +
      formField('df-leads', 'Leads Received', 'number', shown.leads) +
      '</div>' +
      '<div class="cr-form-row" style="margin-top:10px"><label>Notes</label><input id="df-notes" type="text" value="' + esc(shown.notes || '') + '"/></div>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">' +
      '<button type="submit" class="cr-btn cr-btn-primary">Save ' + esc(formatMonthName(month)) + '</button></div>' +
      '</form>';
    container.innerHTML = html;
    Object.keys(keep).forEach(function (f) {
      var inp = document.getElementById(ids[f]);
      if (inp) { inp.classList.add('cr-cell-conflict'); inp.title = 'Someone else saved ' + base[f] + ' here. Save again to keep your value.'; }
    });

    document.getElementById('cr-detail-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var body = { base: {} };
      var changed = 0;
      METRIC_FIELDS.forEach(function (f) {
        var raw = document.getElementById(ids[f]).value;
        var val = f === 'notes' ? raw : Math.max(0, parseInt(raw, 10) || 0);
        if (!sameVal(f, val, base[f])) { body[f] = val; body.base[f] = base[f]; changed++; }
      });
      if (!changed) { showToast('No changes to save'); return; }
      apiSend('PUT', '/api/client-reports/metrics/' + encodeURIComponent(client) + '/' + month, body).then(function (res) {
        var conflicts = res.conflicts || [];
        showToast(res.message || 'Saved', conflicts.length > 0);
        var again = {};
        conflicts.forEach(function (c) { again[c.field] = c.yours; });
        return reloadAndRender().then(function () {
          STATE.detailClient = client; renderDetailModal();
          if (conflicts.length) toggleDetailEditForm(again);
        });
      }).catch(function (e2) { showToast('Save failed: ' + e2.message, true); });
    });
  }
  function formField(id, label, type, value) {
    return '<div class="cr-form-row"><label>' + esc(label) + '</label><input id="' + id + '" type="' + type + '" min="0" value="' + esc(value) + '"/></div>';
  }
