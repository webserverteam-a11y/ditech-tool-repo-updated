  }

  function renderClientModal() {
    var isEditing = !!STATE.editingClientName;
    var p = isEditing ? clientProfile(STATE.editingClientName) : { client: '', domain: '', industry: '', tier: 'Growth', accountManager: '', targetTraffic: 15000, targetLeads: 100, startDate: '' };
    var baseProfile = clone(p); // values the user starts editing from — used for conflict detection
    var content = document.getElementById('cr-modal-client-content');

    var existingNames = STATE.clients.map(function (c) { return c.client; });

    var html = '<div class="cr-modal-hd"><h3>' + (isEditing ? 'Edit Client &mdash; ' + esc(p.client) : 'Add New Client') + '</h3>' +
      '<button class="cr-modal-close" id="cr-cm-close" type="button">&times;</button></div>';
    html += '<form id="cr-client-form"><div class="cr-modal-body">';

    html += '<div class="cr-form-row"><label>Client Name *</label>' +
      '<input id="cm-name" type="text" required list="cr-existing-clients" placeholder="e.g. Apex Legal Group" value="' + esc(p.client) + '" ' + (isEditing ? 'disabled' : '') + '/>' +
      '<datalist id="cr-existing-clients">' + existingNames.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
      '</div>';

    html += '<div class="cr-form-row"><label>Domain</label><input id="cm-domain" type="text" placeholder="e.g. example.com" value="' + esc(p.domain) + '"/></div>';

    html += '<div class="cr-form-grid">' +
      '<div class="cr-form-row"><label>Industry</label><input id="cm-industry" type="text" placeholder="e.g. Healthcare" value="' + esc(p.industry) + '"/></div>' +
      '<div class="cr-form-row"><label>Client Tier</label><select id="cm-tier">' +
      ['Enterprise', 'Growth', 'Starter'].map(function (t) { return '<option value="' + t + '"' + (t === p.tier ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
      '</select></div></div>';

    html += '<div class="cr-form-row"><label>Account Manager</label><input id="cm-manager" type="text" placeholder="e.g. Sarah Jenkins" value="' + esc(p.accountManager) + '"/></div>';

    html += '<div class="cr-form-grid">' +
      '<div class="cr-form-row"><label>Monthly Traffic Target</label><input id="cm-target-traffic" type="number" min="0" value="' + esc(p.targetTraffic) + '"/></div>' +
      '<div class="cr-form-row"><label>Monthly Lead Goal</label><input id="cm-target-leads" type="number" min="0" value="' + esc(p.targetLeads) + '"/></div>' +
      '</div>';

    html += '</div><div class="cr-modal-ft">' +
      '<button type="button" class="cr-btn cr-btn-light" id="cr-cm-cancel">Cancel</button>' +
      '<button type="submit" class="cr-btn cr-btn-primary">' + (isEditing ? 'Save Changes' : 'Create Client') + '</button>' +
      '</div></form>';

    content.innerHTML = html;

    document.getElementById('cr-cm-close').addEventListener('click', closeClientModal);
    document.getElementById('cr-cm-cancel').addEventListener('click', closeClientModal);
    document.getElementById('cr-client-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = (isEditing ? p.client : document.getElementById('cm-name').value).trim();
      if (!name) return;
      var values = {
        domain: document.getElementById('cm-domain').value.trim(),
        industry: document.getElementById('cm-industry').value.trim(),
        tier: document.getElementById('cm-tier').value,
        accountManager: document.getElementById('cm-manager').value.trim(),
        targetTraffic: parseInt(document.getElementById('cm-target-traffic').value, 10) || 0,
        targetLeads: parseInt(document.getElementById('cm-target-leads').value, 10) || 0,
      };
      // "Add" for a name that already exists behaves like an edit of that
      // client, so it must not blank out fields someone already filled in.
      var existing = null;
      STATE.clients.forEach(function (c) { if (c.client.toLowerCase() === name.toLowerCase()) existing = c; });
      var body;
      if (existing) {
        name = existing.client;
        var base = isEditing ? baseProfile : existing;
        body = { base: {} };
        Object.keys(values).forEach(function (f) {
          var changedFromBase = String(values[f]) !== String(base[f] == null ? '' : base[f]);
          var blankOnAdd = !isEditing && (values[f] === '' || values[f] === 0);
          if (changedFromBase && !blankOnAdd) { body[f] = values[f]; body.base[f] = base[f]; }
        });
        if (Object.keys(body.base).length === 0) { showToast('No changes to save'); closeClientModal(); return; }
      } else {
        body = values;
        body.startDate = new Date().toISOString().split('T')[0];
      }
      apiSend('PUT', '/api/client-reports/profiles/' + encodeURIComponent(name), body).then(function (res) {
        var conflicts = res.conflicts || [];
        showToast(res.message || 'Client saved', conflicts.length > 0);
        if (!conflicts.length) closeClientModal();
        return reloadAndRender().then(function () {
          if (conflicts.length) {
            // Re-open on fresh data, keeping what this user typed.
            STATE.editingClientName = name;
            renderClientModal();
            var idMap = { domain: 'cm-domain', industry: 'cm-industry', tier: 'cm-tier', accountManager: 'cm-manager', targetTraffic: 'cm-target-traffic', targetLeads: 'cm-target-leads' };
            conflicts.forEach(function (c) {
              var inp = document.getElementById(idMap[c.field]);
              if (inp) { inp.value = c.yours; inp.classList.add('cr-cell-conflict'); inp.title = 'Someone else saved "' + c.theirs + '". Save again to keep your value.'; }
            });
          }
          if (STATE.detailClient === name && document.getElementById('cr-modal-detail').classList.contains('open')) renderDetailModal();
        });
      }).catch(function (e2) { showToast('Save failed: ' + e2.message, true); });
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     EXPORT / IMPORT MODAL
     ═══════════════════════════════════════════════════════════════ */
  function openExportModal() {
    renderExportModal();
    document.getElementById('cr-modal-export').classList.add('open');
  }
  function closeExportModal() { document.getElementById('cr-modal-export').classList.remove('open'); }

  function renderExportModal() {
    var content = document.getElementById('cr-modal-export-content');
    var monthName = esc(formatMonthName(STATE.month));
    var html = '<div class="cr-modal-hd"><h3>Export / Import Client Data</h3><button class="cr-modal-close" id="cr-em-close" type="button">&times;</button></div>';
    html += '<div class="cr-modal-body">';

    html += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin-bottom:16px">' +
      '<h4 style="font-size:0.84rem;margin-bottom:6px">Export</h4>' +
      '<p style="font-size:0.76rem;color:#64748b;margin-bottom:10px">' +
      '<strong>' + monthName + ' sheet</strong>: one row per client (all ' + STATE.clients.length + '), with blank cells where nothing is recorded yet &mdash; fill the blanks in Excel / Sheets and import it back.<br>' +
      '<strong>Full history</strong>: every month recorded for every client (backup).</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="cr-btn cr-btn-primary" id="cr-em-download" type="button">Download ' + monthName + ' CSV</button>' +
      '<button class="cr-btn cr-btn-light" id="cr-em-download-all" type="button">Download Full History CSV</button>' +
      '</div></div>';

    html += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px">' +
      '<h4 style="font-size:0.84rem;margin-bottom:6px">Import (CSV file or paste)</h4>' +
      '<p style="font-size:0.76rem;color:#64748b;margin-bottom:8px">Header row required. Recognised columns (any order): <code>Client, Month, Organic Traffic, Organic Clicks, Impressions, Leads Received, Notes, Domain, Industry, Tier, Account Manager, Target Traffic, Target Leads</code>. ' +
      'The exported file can be imported as-is. <strong>Blank cells keep the existing value</strong> (they never overwrite data with 0). Rows without a Month go into <strong>' + monthName + '</strong>. CTR is recalculated automatically.</p>' +
      '<input type="file" id="cr-em-file" accept=".csv,.tsv,.txt,text/csv" style="font-size:0.76rem;margin-bottom:8px"/>' +
      '<textarea class="cr-csv-area" id="cr-em-textarea" rows="6" placeholder="Client,Month,Organic Traffic,Organic Clicks,Impressions,Leads Received,Notes"></textarea>' +
      '<div id="cr-em-status" style="font-size:0.76rem;font-weight:700;margin-top:8px;white-space:pre-line"></div>' +
      '<button class="cr-btn cr-btn-primary" id="cr-em-import" type="button" style="margin-top:8px">Parse &amp; Import CSV</button></div>';

    html += '</div><div class="cr-modal-ft"><button class="cr-btn cr-btn-light" id="cr-em-close-bottom" type="button">Close</button></div>';
    content.innerHTML = html;

    document.getElementById('cr-em-close').addEventListener('click', closeExportModal);
    document.getElementById('cr-em-close-bottom').addEventListener('click', closeExportModal);
    document.getElementById('cr-em-download').addEventListener('click', downloadCSV);
    document.getElementById('cr-em-download-all').addEventListener('click', downloadHistoryCSV);
    document.getElementById('cr-em-import').addEventListener('click', importCSV);
    document.getElementById('cr-em-file').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        document.getElementById('cr-em-textarea').value = String(reader.result || '');
        var statusEl = document.getElementById('cr-em-status');
        statusEl.style.color = '#64748b';
        statusEl.textContent = 'Loaded "' + file.name + '" — click "Parse & Import CSV" to import.';
      };
      reader.readAsText(file);
    });
  }

  function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
  function triggerCsvDownload(lines, filename) {
    // BOM so Excel opens UTF-8 names correctly.
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.setAttribute('download', filename);
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  }

  var EXPORT_HEADERS = ['Client', 'Domain', 'Industry', 'Tier', 'Account Manager', 'Month', 'Organic Traffic', 'MoM Traffic %', 'Organic Clicks', 'Impressions', 'CTR (%)', 'Leads Received', 'MoM Leads %', 'Target Traffic', 'Target Leads', 'Notes'];

  function exportRow(c, month) {
    var m = STATE.metrics[c.client] && STATE.metrics[c.client][month];
    var comp = buildComparison(c.client, month);
    var prevExists = hasDbRow(c.client, prevMonthKey(month));
    // Metrics with no saved row are exported BLANK (not 0) so re-importing
    // the sheet can never overwrite data someone entered in the meantime.
    return [c.client, c.domain, c.industry, c.tier, c.accountManager, month,
      m ? m.organicTraffic : '', (m && prevExists) ? comp.traffic.percentChange + '%' : '',
      m ? m.organicClicks : '', m ? m.impressions : '', m ? m.ctr : '',
      m ? m.leads : '', (m && prevExists) ? comp.leads.percentChange + '%' : '',
      c.targetTraffic, c.targetLeads, m ? (m.notes || '') : ''].map(csvCell).join(',');
  }

  function downloadCSV() {
    var rows = STATE.clients.map(function (c) { return exportRow(c, STATE.month); });
    triggerCsvDownload([EXPORT_HEADERS.join(',')].concat(rows), 'client-report-' + STATE.month + '.csv');
  }

  function downloadHistoryCSV() {
    var rows = [];
    STATE.clients.forEach(function (c) {
      Object.keys(STATE.metrics[c.client] || {}).sort().forEach(function (month) { rows.push(exportRow(c, month)); });
    });
    if (!rows.length) { showToast('No metric history recorded yet.', true); return; }
    triggerCsvDownload([EXPORT_HEADERS.join(',')].concat(rows), 'client-report-full-history.csv');
  }

  function importCSV() {
    var textarea = document.getElementById('cr-em-textarea');
    var statusEl = document.getElementById('cr-em-status');
    var btn = document.getElementById('cr-em-import');
    var csv = textarea.value;
    if (!csv.trim()) { statusEl.style.color = '#dc2626'; statusEl.textContent = 'Paste CSV text or choose a file first.'; return; }
    btn.disabled = true;
    statusEl.style.color = '#64748b';
    statusEl.textContent = 'Importing…';
    apiSend('POST', '/api/client-reports/import', { csv: csv, defaultMonth: STATE.month }).then(function (res) {
      var skipped = res.skipped || [];
      statusEl.style.color = skipped.length ? '#b45309' : '#16a34a';
      var text = res.message || 'Imported successfully';
      if (skipped.length) {
        text += '\nSkipped rows:\n' + skipped.slice(0, 15).map(function (s) {
          return '  line ' + s.line + (s.client ? ' (' + s.client + ')' : '') + ': ' + s.reason;
        }).join('\n') + (skipped.length > 15 ? '\n  …and ' + (skipped.length - 15) + ' more' : '');
      }
      statusEl.textContent = text;
      if (!skipped.length) textarea.value = '';
      var fileInput = document.getElementById('cr-em-file');
      if (fileInput) fileInput.value = '';
      return reloadAndRender();
    }).catch(function (e) {
      statusEl.style.color = '#dc2626';
      statusEl.textContent = 'Import failed: ' + e.message;
    }).then(function () { btn.disabled = false; });
  }

  /* ═══════════════════════════════════════════════════════════════
     TAB / MONTH SWITCHING + INIT
     ═══════════════════════════════════════════════════════════════ */
  function renderCurrentTab() {
    document.getElementById('cr-summary-hint').textContent = STATE.clients.length + ' client(s) tracked' +
      (pendingTotal() ? ' · ' + pendingTotal() + ' unsaved row(s) in Bulk Entry' : '');
    if (STATE.tab === 'dashboard') renderDashboard();
    else if (STATE.tab === 'clients') renderClientsTable();
    else if (STATE.tab === 'bulk') renderBulkEntry();
  }

  function switchTab(tab) {
    STATE.tab = tab;
    document.querySelectorAll('.cr-tab-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });
    document.querySelectorAll('.cr-view').forEach(function (view) { view.classList.remove('active'); });
    document.getElementById('cr-view-' + tab).classList.add('active');
    renderCurrentTab();
  }

  // Unsaved edits are stored per month, so switching months never drops them.
  function setMonth(month) {
    STATE.month = month;
    var sel = document.getElementById('cr-month-select');
    if (sel && sel.value !== month) {
      if (!sel.querySelector('option[value="' + month + '"]')) {
        var opt = document.createElement('option'); opt.value = month; opt.textContent = formatMonthName(month); sel.appendChild(opt);
      }
      sel.value = month;
    }
    renderCurrentTab();
  }

  function initMonthSelect() {
    var sel = document.getElementById('cr-month-select');
    var months = monthsList(18);
    sel.innerHTML = months.map(function (m) { return '<option value="' + m + '">' + formatMonthName(m) + '</option>'; }).join('');
    sel.value = STATE.month;
    sel.addEventListener('change', function () { setMonth(sel.value); });
  }

  // Pull other people's saves when it is safe to re-render (not while this
  // user is typing or has a modal open). Pending edits are never touched.
  function isUserBusy() {
    if (STATE.saving) return true;
    if (document.querySelector('.cr-modal-overlay.open')) return true;
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') && a.closest('#cr-view-bulk, #cr-view-clients'));
  }
  function backgroundRefresh() {
    if (document.hidden || isUserBusy()) return;
    reloadAndRender();
  }

  document.addEventListener('DOMContentLoaded', function () {
    STATE.pending = loadPending();
    initMonthSelect();

    document.querySelectorAll('.cr-tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { switchTab(btn.getAttribute('data-tab')); });
    });
    document.getElementById('cr-btn-add-client').addEventListener('click', function () { openClientModal(null); });
    document.getElementById('cr-btn-export').addEventListener('click', openExportModal);

    // Close modals on overlay click (not on inner card click)
    ['cr-modal-detail', 'cr-modal-client', 'cr-modal-export'].forEach(function (id) {
      document.getElementById(id).addEventListener('click', function (e) {
        if (e.target.id === id) {
          if (id === 'cr-modal-detail') closeDetailModal();
          else if (id === 'cr-modal-client') closeClientModal();
          else closeExportModal();
        }
      });
    });

    window.addEventListener('beforeunload', function (e) {
      if (pendingTotal() > 0) { e.preventDefault(); e.returnValue = ''; }
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) backgroundRefresh(); });
    setInterval(backgroundRefresh, 120000);

    document.getElementById('cr-view-dashboard').innerHTML = '<div class="cr-card"><div class="cr-state-box"><div>Loading client report data&hellip;</div></div></div>';

    reloadAndRender().then(function () {
      var n = pendingTotal();
      if (n) showToast('Restored unsaved edits for ' + n + ' client row(s) from this browser — see Bulk Entry and click Save.');
    });
  });

})();
</script>
</body>
</html>
