    // Config persistence — must run BEFORE React module loads
    // Ensures PUT requests survive page unload via keepalive
    (function () {
      var PREFIX = '_seo_backup_';
      // NOTE: 'users' is intentionally excluded from page-load re-sync.
      // The DB is the source of truth for users. Re-syncing localStorage on
      // page load would overwrite DB users with stale cached data, deleting
      // any users not present in the old cache (including newly created ones).

      var CONFIG_RE = /^\/api\/config\/(users|admin_options|nav_access)$/;

            // page reload, so the data never reaches the DB.

            return _fetch(input, opts);

                        status: 200,
                        headers: { 'Content-Type': 'application/json' }
                      });
                    }
                    return response;
                  }).catch(function () { return response; });
                });
              }
            }
          }

        return _fetch(input, init);
      };

      function mergeConfig(key, server, backup) {
        if (key === 'users') {
          // DB is the source of truth for users. Never merge localStorage
          // backup on top of the server response — doing so would re-introduce
          // deleted users (e.g. Aman, Heena) back into the UI.
          return null;

          if (!server || typeof server !== 'object') return backup;
          if (!backup || typeof backup !== 'object') return null;
          var bKeys = Object.keys(backup).filter(function (k) { return backup[k]; });
          var sKeys = Object.keys(server).filter(function (k) { return server[k]; });

          }

          if (!server || typeof server !== 'object') return null;
          return null;

      // On page load: re-send backups to server as safety net

                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: saved,
                keepalive: true

            }, 500);
          }
        } catch (e) { }
      });
    })();

  <script>
    // Owner-array sanitization — must run BEFORE React module loads.
    // The compiled React bundle has hardcoded fallback owner arrays (e.g.
    // webOwners:["Gauri","Shubham"]) and caches admin_options in localStorage
    // under "seo_admin_options". When the page loads, React reads localStorage
    // BEFORE the API fetch completes, so stale/deleted users appear in dropdowns.
    //
    // Fix: owner arrays (*Owners) are ALWAYS derived from the users DB table via
    // GET /api/config/admin_options. They must never persist in localStorage.
    (function () {
      var DYNAMIC_OWNER_KEYS = [
        'seoOwners', 'contentOwners', 'webOwners',
        'adsOwners', 'designOwners', 'socialOwners', 'webdevOwners'
      ];
      var ADMIN_OPTS_KEY = 'seo_admin_options';
      var BACKUP_KEY = '_seo_backup_admin_options';

      function stripOwners(jsonStr) {
        if (!jsonStr) return jsonStr;
        try {
          var obj = JSON.parse(jsonStr);
          if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
            var changed = false;
            DYNAMIC_OWNER_KEYS.forEach(function (k) {
              if (k in obj) {
                obj[k] = [];
                changed = true;
              }
            });
            if (changed) return JSON.stringify(obj);
          }
        } catch (e) { }
        return jsonStr;
      }

      // 1. On startup: immediately sanitize both localStorage keys
      [ADMIN_OPTS_KEY, BACKUP_KEY].forEach(function (key) {
        try {
          var raw = localStorage.getItem(key);
          if (raw) {
            var cleaned = stripOwners(raw);
            if (cleaned !== raw) localStorage.setItem(key, cleaned);
          }
        } catch (e) { }
      });

      // 2. Intercept localStorage.getItem — strip owners on every read
      var _origGetItem = localStorage.getItem.bind(localStorage);
      localStorage.getItem = function (key) {
        var val = _origGetItem(key);
        if (key === ADMIN_OPTS_KEY || key === BACKUP_KEY) {
          return stripOwners(val);
        }
        return val;
      };

      // 3. Intercept localStorage.setItem — strip owners before every write
      //    (Note: the sync script below already patches setItem for SYNC_MAP keys.
      //     We wrap whatever setItem is current, so both patches compose correctly.)
      var _origSetItem = localStorage.setItem.bind(localStorage);
      localStorage.setItem = function (key, value) {
        if (key === ADMIN_OPTS_KEY || key === BACKUP_KEY) {
          value = stripOwners(value);
        }
        return _origSetItem(key, value);
      };
    })();

    // Sync localStorage-only data to/from the DB so data loads dynamically
    // across sessions and browsers. These 4 keys are never sent to the server
    // by the React app — we bridge that gap here.
    (function () {
      var _f = window._origFetch || window.fetch.bind(window);
      var SYNC_MAP = {
        'seo_client_config': '/api/client-config',
        'seo_historical_kw': '/api/historical-keywords',
        'seo_leave_records': '/api/leave-records',
        'seo_workhub_remarks': '/api/workhub-remarks'
      };
      var loaded = {};
      var dirty = {};
      var loadPromises = [];

      // ── Format transforms: server API response → React localStorage format ──
      // React reads these keys synchronously (useState initializer). If the DB
      // response format differs from what React expects, the component crashes.
      // leave: server gives {userName,leaveDate,leaveType,reason}
      //        React needs  {owner,date,type,note}
      function toReactFormat(lsKey, data) {
        if (lsKey === 'seo_leave_records' && Array.isArray(data)) {
          return data.map(function(r) {
            return {
              id:    r.id,
              owner: r.userName  || r.owner  || '',
              date:  r.leaveDate
                       ? (typeof r.leaveDate === 'string'
                           ? r.leaveDate.slice(0, 10)
                           : new Date(r.leaveDate).toISOString().slice(0, 10))
                       : (r.date || ''),
              type:  r.leaveType || r.type  || 'full',
              note:  r.reason    || r.note  || '',
            };
          });
        }
        return data;
      }

      // ── SYNCHRONOUS pre-flight: fix any server-formatted leave records that
      // may already be in localStorage before React reads them (React calls
      // localStorage.getItem('seo_leave_records') synchronously in useState).
      (function sanitizeLeaveRecords() {
        try {
          var raw = localStorage.getItem('seo_leave_records');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed) || parsed.length === 0) return;
          // Detect server format: has leaveDate or userName but no date/owner
          var first = parsed[0];
          if ((first.leaveDate !== undefined || first.userName !== undefined) &&
              first.date === undefined) {
            var fixed = toReactFormat('seo_leave_records', parsed);
            localStorage.setItem('seo_leave_records', JSON.stringify(fixed));
            console.log('[sync] Converted leave records to React format (' + fixed.length + ' records)');
          }
        } catch (e) {}
      })();

      // On page load: fetch each key from DB → populate localStorage
      // Track promises so we don't flush stale data before DB load completes
      Object.entries(SYNC_MAP).forEach(function (entry) {
        var lsKey = entry[0], apiUrl = entry[1];
        var p = _f(apiUrl).then(function (r) { return r.json(); }).then(function (data) {
          var hasData = data && ((Array.isArray(data) && data.length > 0) ||
            (!Array.isArray(data) && Object.keys(data).length > 0));
          if (hasData) {
            // DB has data → convert to React format and store (DB is source of truth)
            var toStore = toReactFormat(lsKey, data);
            localStorage.setItem(lsKey, JSON.stringify(toStore));
          } else {
            // DB is empty → push existing localStorage data to DB (one-time migration)
            // Read current localStorage value (already in React format after sanitize above)
            var existing;
            try { existing = localStorage.getItem(lsKey); } catch (e) {}
            if (existing) {

              try { parsed = JSON.parse(existing); } catch(e) {}

                (!Array.isArray(parsed) && typeof parsed === 'object' && Object.keys(parsed).length > 0));
              if (hasLocal) {

                  _f(apiUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: existing,
                    keepalive: true
                  }).then(function(r){ return r.json(); })
                    .then(function(d){ console.log('[sync] Migrated ' + lsKey + ' to DB:', d && d.message); })
                    .catch(function(e){ console.warn('[sync] Migration failed for ' + lsKey, e); });
                }, 800);
              }
            }
          }
          loaded[lsKey] = true;
        }).catch(function () { loaded[lsKey] = true; });
        loadPromises.push(p);
      });
      // Mark all keys as clean after DB load — React may setItem during load,
      // which marks keys dirty with stale data. Clear dirty flags once DB wins.
      Promise.all(loadPromises).then(function () { dirty = {}; });

      // Watch for localStorage changes and mark keys dirty
      var origSetItem = localStorage.setItem;

        Object.keys(dirty).forEach(function (lsKey) {
          if (!loaded[lsKey]) return; // skip — DB GET hasn't finished yet
          var raw;
          try { raw = localStorage.getItem(lsKey); } catch (e) { return; }
          if (!raw) return;
          _f(SYNC_MAP[lsKey], {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: raw,
            keepalive: !!useKeepalive
          }).catch(function () { });
        });
        dirty = {};
      }

      // Periodic sync every 30s for dirty keys
      setInterval(function () { flushToDb(false); }, 30000);

      // On page unload: flush with keepalive

      document.addEventListener('visibilitychange', function () {

      });

  <script>
    // ── Task delete fix ───────────────────────────────────────────────────
    // The compiled React app removes deleted tasks from local state, then
    // the debounced PUT /api/tasks sends the remaining tasks. However, PUT
    // only upserts — it never removes rows from the DB. So deleted tasks
    // reappear on the next fetch (page reload / tab focus).
    //
    // Fix: intercept PUT /api/tasks, compare incoming task IDs against the
    // last-known set, and fire DELETE /api/tasks/:id for any IDs that
    // disappeared.
    //
    // Race-condition guard: a pendingDeletes map prevents stale GET responses
    // (arriving before DELETE commits) from re-adding a deleted ID into
    // knownTaskIds. Without this, the sequence:
    //   DELETE fires → GET returns stale row → knownTaskIds revived → task reappears
    // would cause the task to bounce back.
    // ──────────────────────────────────────────────────────────────────────
    (function () {
      var _fetch = window._origFetch || window.fetch.bind(window);
      var knownTaskIds = null;   // { id: true } — last-known full set
      var pendingDeletes = {};   // { id: true } — DELETEs currently in-flight
      var origFetch = window.fetch; // may already be patched by earlier scripts

      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        var method = (init && init.method) ? init.method.toUpperCase() : 'GET';

        // Track task IDs from GET /api/tasks (initial load + visibility refetch)
        if (method === 'GET' && url === '/api/tasks') {
          return origFetch.call(window, input, init).then(function (response) {
            var clone = response.clone();
            clone.json().then(function (data) {
              if (Array.isArray(data) && data.length > 0) {
                knownTaskIds = {};
                data.forEach(function (t) {
                  // Skip IDs with an in-flight DELETE — stale DB row
                  if (t && t.id && !pendingDeletes[t.id]) {
                    knownTaskIds[t.id] = true;
                  }
                });
              }
            }).catch(function () {});
            return response;
          });
        }

        // Intercept bulk PUT /api/tasks (NOT single-task /api/tasks/:id)
        if (method === 'PUT' && url === '/api/tasks' && init && init.body) {
          var tasks;
          try { tasks = JSON.parse(init.body); } catch (e) { tasks = null; }

          if (Array.isArray(tasks) && knownTaskIds) {
            var newIds = {};
            tasks.forEach(function (t) { if (t && t.id) newIds[t.id] = true; });

            // Find IDs that were known but are now missing AND not already pending
            var deletedIds = [];
            Object.keys(knownTaskIds).forEach(function (id) {
              if (!newIds[id] && !pendingDeletes[id]) deletedIds.push(id);
            });

            // Fire DELETE for each removed task
            if (deletedIds.length > 0) {
              deletedIds.forEach(function (id) {
                // Mark pending BEFORE the async call — closes the race window
                pendingDeletes[id] = true;

                _fetch('/api/tasks/' + encodeURIComponent(id), {
                  method: 'DELETE',
                  keepalive: true
                }).then(function (r) {
                  delete pendingDeletes[id];
                  if (r.ok) console.log('[delete-fix] Deleted task:', id);
                  else console.warn('[delete-fix] DELETE failed for', id, r.status);
                }).catch(function (e) {
                  delete pendingDeletes[id];
                  console.error('[delete-fix] DELETE error for', id, e);
                });
              });
            }

            // Update known IDs to the new set
            knownTaskIds = newIds;
          } else if (Array.isArray(tasks)) {
            // First PUT before any GET — just record the IDs
            knownTaskIds = {};
            tasks.forEach(function (t) { if (t && t.id) knownTaskIds[t.id] = true; });
          }
        }

        return origFetch.call(window, input, init);
      };
    })();
  </script>

  <script>
    // Action Board date-range fix: the compiled React bundle defaults both
    // "From Date" and "To Date" to today (YYYY-MM-DD). This means any task
    // with a future intakeDate (e.g. tomorrow, next week) is invisible.
    //
    // Fix: detect the Action Board's "To Date" input after React mounts and
    // widen it to the end of the current month. This ensures tasks dated
    // anywhere within the month are visible by default. Users can still
    // narrow the range manually.
    (function () {
      var applied = false;
      function getEndOfMonth() {
        var d = new Date();
        var last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        return last.toISOString().split('T')[0];
      }

      function tryFixDates() {
        if (applied) return;
        // The Action Board has two date inputs with labels "From Date" and "To Date"
        var labels = document.querySelectorAll('label');
        var toLabel = null;
        for (var i = 0; i < labels.length; i++) {
          if (labels[i].textContent.trim() === 'To Date') {
            toLabel = labels[i];
            break;
          }
        }
        if (!toLabel) return;
        // The input[type="date"] is a sibling inside the same parent div
        var container = toLabel.parentElement;
        if (!container) return;
        var toInput = container.querySelector('input[type="date"]');
        if (!toInput) return;

        var today = new Date().toISOString().split('T')[0];
        var eom = getEndOfMonth();
        // Only widen if the current value is exactly today (the default)
        if (toInput.value === today && eom > today) {
          // Trigger React's controlled input update via native setter + events
          var nativeInputValueSetter = Object.getOwnPropertyDescriptor(
            window.HTMLInputElement.prototype, 'value'
          ).set;
          nativeInputValueSetter.call(toInput, eom);
          toInput.dispatchEvent(new Event('input', { bubbles: true }));
          toInput.dispatchEvent(new Event('change', { bubbles: true }));
          applied = true;
        }
      }

      // Watch for the Action Board to mount (SPA — it won't be there on initial load)
      new MutationObserver(function () {
        tryFixDates();
      }).observe(document.body, { childList: true, subtree: true });

      // Also try on initial page load in case Action Board is the default view
      setTimeout(tryFixDates, 1500);
      setTimeout(tryFixDates, 3000);
    })();
  </script>

  <div id="_dt-toast"></div>
  <script>
    (function () {
      function showToast(msg, type, duration) {
        var container = document.getElementById('_dt-toast');
        if (!container) return;
        var el = document.createElement('div');
        el.className = '_dt-toast-item ' + (type || 'info');
        el.textContent = msg;
        container.appendChild(el);
        var t = duration || (type === 'error' ? 5000 : 3000);
        setTimeout(function () {
          el.classList.add('fade');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
        }, t);
      }

      // Expose globally so any custom script can call it too
      window._showToast = showToast;

      // Track logged-in user for logAudit shim (set by the app after login)
      window.__dtUser = window.__dtUser || null;

      var _originalFetch = window.fetch;
      window.fetch = function (input, init) {
        var method = ((init && init.method) || 'GET').toUpperCase();
        var url = (typeof input === 'string' ? input : (input && input.url)) || '';

        // Capture logged-in user from /api/login response
        var isLogin = method === 'POST' && url.indexOf('/api/login') !== -1;

        // Only show toasts for mutating calls to our own API
        var isMutation = ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method);
        var isApi = url.indexOf('/api/') !== -1;
        // Config saves (/api/config/*) are automatic background operations — suppress
        // success toasts for them so they don't spam the user. Errors still show.
        var isConfigSave = url.indexOf('/api/config/') !== -1;
        if (!isMutation || !isApi) return _originalFetch.apply(this, arguments);

        return _originalFetch.apply(this, arguments).then(function (response) {
          // Clone so the real consumer can still read the body
          var clone = response.clone();
          clone.json().then(function (data) {
            if (!data) return;
            // Store user from login response
            if (isLogin && response.ok && data.user) {
              window.__dtUser = data.user;
            }
            if (response.ok && data.message && !isConfigSave) {
              showToast(data.message, 'success');
            } else if (!response.ok && data.error) {
              // data.error can be a plain string (legacy routes) or an object
              // { code, message } (new-style error handler). Always show a string.
              var errMsg = typeof data.error === 'string'
                ? data.error
                : (data.error && (data.error.message || data.error.code)
                    ? (data.error.message || data.error.code)
                    : 'An error occurred');
              showToast(errMsg, 'error');
            }
          }).catch(function () { /* ignore non-JSON */ });
          return response;
        }).catch(function (err) {
          showToast('Network error: ' + (err && err.message ? err.message : 'request failed'), 'error');
          throw err;
        });
      };
    })();
  </script>

          var assigned = fmtDateOnly(t.intakeDate || t.contentAssignedDate || t.webAssignedDate);
          var started = null, ended = null;
          if (Array.isArray(t.timeEvents) && t.timeEvents.length > 0) {
            var starts = t.timeEvents.filter(function(e){ return e.type === 'start'; });
            var ends   = t.timeEvents.filter(function(e){ return e.type === 'end'; });
            if (starts.length > 0) started = fmtDate(starts[0].timestamp);
            if (ends.length > 0)   ended   = fmtDate(ends[ends.length - 1].timestamp);
          }
          taskMap[t.id] = { assigned: assigned, started: started, ended: ended };
        });
      }

      // Find the task ID from the card's DOM. The task card shows the task ID
      // as a badge like "TASK-0001" at the top left.
      function getCardId(card) {
        var badges = card.querySelectorAll('span, div, p');
        for (var i = 0; i < badges.length; i++) {
          var txt = badges[i].textContent.trim();
          if (/^TASK-\d+$/.test(txt)) return txt;
          // Also check data-id or id attribute
          if (badges[i].getAttribute && badges[i].getAttribute('data-id')) return badges[i].getAttribute('data-id');
        }
        return null;
      }

      // Inject timestamps as a proper column into the Action Board list view table — DISABLED
      function injectListViewTimestamps() {
        return; // DISABLED: timestamp column hidden per user request
        var tables = document.querySelectorAll('table');
        tables.forEach(function(table) {
          var headerRow = table.querySelector('thead tr');
          if (!headerRow) return;
          var ths = headerRow.querySelectorAll('th');
          if (ths.length < 5) return;
          var texts = [];
          ths.forEach(function(th) { texts.push(th.textContent.trim()); });
          // Must be the Action Board list view (has "Task" and "Actions" headers)
          if (texts.indexOf('Task') === -1 || texts.indexOf('Actions') === -1) return;
          if (texts.indexOf('Timestamps') !== -1) return; // already injected

          // Insert "Timestamps" <th> after the "Task" header
          var taskTh = null;
          ths.forEach(function(th) { if (th.textContent.trim() === 'Task') taskTh = th; });
          if (!taskTh) return;
          var newTh = document.createElement('th');
          newTh.className = 'px-3 py-2.5';
          newTh.style.cssText = 'width:180px;white-space:nowrap;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.05em;background:#f8fafc;';
          newTh.textContent = 'Timestamps';
          taskTh.insertAdjacentElement('afterend', newTh);

          // Add a <td> for timestamps to every tbody row
          var bodyRows = table.querySelectorAll('tbody tr');
          bodyRows.forEach(function(row) {
            if (row.querySelector('._dt-ts-cell')) return; // already injected
            var cells = row.querySelectorAll('td');
            if (cells.length === 0) return;

            // Expanded detail row (single <td> spanning all cols) — just widen the span
            if (cells.length === 1 && parseInt(cells[0].colSpan || cells[0].getAttribute('colspan') || 1) > 1) {
              cells[0].colSpan = parseInt(cells[0].colSpan) + 1;
              return;
            }

            // Get the TASK-XXXX id from this row
            var id = null;
            var elems = row.querySelectorAll('span, div, p');
            for (var i = 0; i < elems.length; i++) {
              var txt = elems[i].textContent.trim();
              if (/^TASK-\d+$/.test(txt)) { id = txt; break; }
            }

            var td = document.createElement('td');
            td.className = '_dt-ts-cell';
            td.style.cssText = 'padding:4px 8px;vertical-align:middle;min-width:160px;border-bottom:1px solid #f1f5f9;';
            if (id && taskMap[id]) {
              var info = taskMap[id];
              var html = '<div class="_dt-timestamps" style="margin:0;flex-direction:column;gap:2px;">';
              if (info.assigned) html += '<span class="ts-assigned">📅 <b>Assigned:</b> ' + info.assigned + '</span>';
              if (info.started)  html += '<span class="ts-started">▶ <b>Started:</b> '   + info.started  + '</span>';
              if (info.ended)    html += '<span class="ts-ended">✓ <b>Last End:</b> '    + info.ended    + '</span>';
              html += '</div>';
              td.innerHTML = html;
            } else {
              td.innerHTML = '<span style="color:#cbd5e1;font-size:10px;">—</span>';
            }
            // Insert after first cell (Task cell)
            cells[0].insertAdjacentElement('afterend', td);
          });
        });
      }

      // Inject timestamp bar into a card view task card (non-table view) — DISABLED
      function injectTimestamps(card) {
        return; // DISABLED: timestamps hidden per user request
        if (card.querySelector('._dt-timestamps')) return; // already injected
        if (card.tagName === 'TABLE' || card.querySelector('thead') || card.closest('table')) return;
        var id = getCardId(card);
        if (!id || !taskMap[id]) return;
        var info = taskMap[id];
        if (!info.assigned && !info.started && !info.ended) return;

        var bar = document.createElement('div');
        bar.className = '_dt-timestamps';
        if (info.assigned) bar.innerHTML += '<span class="ts-assigned">📅 <b>Assigned:</b> ' + info.assigned + '</span>';
        if (info.started)  bar.innerHTML += '<span class="ts-started">▶ <b>Started:</b> '  + info.started  + '</span>';
        if (info.ended)    bar.innerHTML += '<span class="ts-ended">✓ <b>Last End:</b> '   + info.ended    + '</span>';

        // Insert after the first <h3> or font-semibold element inside the card
        var anchor = card.querySelector('h3, h2, [class*="title"], [class*="font-semibold"]');
        if (anchor && anchor.parentNode === card) {
          anchor.insertAdjacentElement('afterend', bar);
        } else {
          var first = card.firstElementChild;
          if (first) first.insertAdjacentElement('afterend', bar);
          else card.prepend(bar);
        }
      }

      // Scan for list view table or card view cards and inject timestamps
      function scanCards() {
        // Detect if list view is active (Action Board table with Task + Actions headers)
        var listViewActive = false;
        var tables = document.querySelectorAll('table');
        tables.forEach(function(table) {
          var headerRow = table.querySelector('thead tr');
          if (!headerRow) return;
          var texts = [];
          headerRow.querySelectorAll('th').forEach(function(th) { texts.push(th.textContent.trim()); });
          if (texts.indexOf('Task') !== -1 && texts.indexOf('Actions') !== -1) listViewActive = true;
        });

        if (listViewActive) {
          injectListViewTimestamps();
        } else {
          // Card view: inject into individual task card divs (skip anything table-related)
          var candidates = document.querySelectorAll('[class*="rounded"], [class*="border"], [class*="card"]');
          candidates.forEach(function(el) {
            if (el.tagName === 'TABLE' || el.querySelector('thead') || el.closest('table')) return;
            var id = getCardId(el);
            if (id && taskMap[id]) injectTimestamps(el);
          });
        }
      }

      // Load tasks then attach observer
      function init() {
        _f('/api/tasks').then(function(r){ return r.json(); }).then(function(tasks) {
          if (!Array.isArray(tasks)) return;
          buildMap(tasks);
          scanCards();
          // Watch for SPA navigation / new cards or table rows appearing (debounced)
          var _scanTimer = null;
          new MutationObserver(function() {
            if (_scanTimer) clearTimeout(_scanTimer);
            _scanTimer = setTimeout(scanCards, 80);
          }).observe(document.body, { childList: true, subtree: true });
        }).catch(function(){});
      }

      // Intercept GET /api/tasks to keep taskMap fresh whenever React re-fetches
      var origFetch = window.fetch;
      window.fetch = function(input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        var method = ((init && init.method) || 'GET').toUpperCase();
        if (method === 'GET' && url === '/api/tasks') {
          return origFetch.apply(this, arguments).then(function(response) {
            var clone = response.clone();
            clone.json().then(function(tasks) {
              if (Array.isArray(tasks)) { buildMap(tasks); scanCards(); }
            }).catch(function(){});
            return response;
          });
        }
        return origFetch.apply(this, arguments);
      };

      // Wait for React to mount before first scan
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function(){ setTimeout(init, 2000); });
      } else {
        setTimeout(init, 2000);
      }
    })();
  </script>

  <!-- ── Leave & Holiday Remove button — confirmation modal + DELETE API ─── -->
  <script>
    (function () {
      /* ── Inject modal HTML ── */
      var modalHtml = '<div id="_lv-remove-modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:2147483647;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);">'
        + '<div style="background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.18);padding:28px 32px;max-width:400px;width:90%;font-family:inherit;">'
        + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">'
        + '<span style="width:36px;height:36px;border-radius:50%;background:#FEF2F2;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'
        + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>'
        + '</span>'
        + '<h3 style="margin:0;font-size:15px;font-weight:600;color:#111827;">Remove Record</h3>'
        + '</div>'
        + '<p style="margin:0 0 6px;font-size:13px;color:#374151;font-weight:500;">Do you really want to remove this record?</p>'
        + '<p id="_lv-modal-detail" style="margin:0 0 20px;font-size:12px;color:#6B7280;"></p>'
        + '<div style="display:flex;gap:10px;justify-content:flex-end;">'
        + '<button id="_lv-modal-no" style="padding:8px 18px;border-radius:8px;border:1px solid #D1D5DB;background:#fff;color:#374151;font-size:13px;font-weight:500;cursor:pointer;">No, keep it</button>'
        + '<button id="_lv-modal-yes" style="padding:8px 18px;border-radius:8px;border:none;background:#DC2626;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">Yes, remove</button>'
        + '</div>'
        + '</div>'
        + '</div>';

      document.addEventListener('DOMContentLoaded', function () {
        document.body.insertAdjacentHTML('beforeend', modalHtml);

        var modal = document.getElementById('_lv-remove-modal');
        var yesBtn = document.getElementById('_lv-modal-yes');
        var noBtn = document.getElementById('_lv-modal-no');
        var detailEl = document.getElementById('_lv-modal-detail');

        noBtn.addEventListener('click', function () {
          modal.style.display = 'none';
        });

        /* Close on backdrop click */
        modal.addEventListener('click', function (e) {
          if (e.target === modal) modal.style.display = 'none';
        });
      });

      /* ── Helper: look up leave record from localStorage by owner + date ── */
      function findLeaveRecord(owner, date) {
        try {
          var records = JSON.parse(localStorage.getItem('seo_leave_records') || '[]');
          return records.find(function (r) {
            return (r.owner === owner || r.userName === owner) &&
                   (r.date === date || (r.leaveDate && r.leaveDate.slice(0, 10) === date));
          }) || null;
        } catch (e) { return null; }
      }

      /* ── Intercept Remove button clicks in the leave table (capture phase) ── */
      var _lvAllowRemove = false;
      var _lvPendingBtn = null;

      document.addEventListener('click', function (evt) {
        if (_lvAllowRemove) return; /* already approved — let React handle it */

        var btn = evt.target.closest('button');
        if (!btn || btn.textContent.trim() !== 'Remove') return;

        /* Confirm it's inside a tbody > tr with date in 2nd cell */
        var row = btn.closest('tr');
        if (!row) return;
        var cells = row.querySelectorAll('td');
        if (cells.length < 2) return;

        var owner = (cells[0].textContent || '').trim();
        var date  = (cells[1].textContent || '').trim();

        /* Validate date format YYYY-MM-DD */
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;

        /* Must be a leave record — look it up */
        var record = findLeaveRecord(owner, date);
        if (!record) return; /* not a leave row, pass through */

        /* Stop React from handling this click */
        evt.stopImmediatePropagation();
        evt.preventDefault();

        _lvPendingBtn = btn;

        /* Populate modal detail */
        var typeLabel = record.type === 'full' ? 'Full day leave'
                      : record.type === 'half' ? 'Half day'
                      : record.type === 'holiday' ? 'Public holiday'
                      : record.type || 'leave';
        var detailEl = document.getElementById('_lv-modal-detail');
        if (detailEl) {
          detailEl.textContent = owner + ' · ' + date + ' (' + typeLabel + ')';
        }

        /* Show modal */
        var modal = document.getElementById('_lv-remove-modal');
        if (modal) modal.style.display = 'flex';

        /* Wire Yes button */
        var yesBtn = document.getElementById('_lv-modal-yes');
        if (yesBtn) {
          /* Clone to clear any previous onclick */
          var newYes = yesBtn.cloneNode(true);
          yesBtn.parentNode.replaceChild(newYes, yesBtn);
          newYes.addEventListener('click', function () {
            var m = document.getElementById('_lv-remove-modal');
            if (m) m.style.display = 'none';

            /* 1) Call DELETE API to remove from DB */
            if (record && record.id) {
              (window._origFetch || fetch)(
                '/api/leave-records/' + encodeURIComponent(record.id),
                { method: 'DELETE' }
              ).then(function (r) { return r.json(); })
               .then(function (d) { console.log('[leave-remove] deleted from DB:', d); })
               .catch(function (e) { console.error('[leave-remove] DELETE error:', e); });
            }

            /* 2) Let React handle the click (removes from state + localStorage) */
            if (_lvPendingBtn) {
              _lvAllowRemove = true;
              _lvPendingBtn.click();
              _lvAllowRemove = false;
              _lvPendingBtn = null;
            }
          });
        }
      }, true /* capture phase */);
    })();
  </script>

  <!-- ── Work Hub "Import Excel/CSV" — pre-upload format/demo modal ──────
       Work Hub only (label text "Import Excel/CSV", accept=".csv,.xlsx,.xls").
       Does NOT touch Action Board's CSV import ("Upload Tasks" label) or the
       Keywords panel's CSV import — those are matched on different text and
       are left completely alone per explicit instruction.
       Intercepts the click on the label (before the browser forwards it to
       the hidden <input type="file">) and shows a modal explaining the
       expected columns, with a "Download Demo CSV" button. Only when the
       user clicks "Choose File…" does the real file input get triggered.
  ──────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var MODAL_ID = '_wh-import-modal';
      var pendingInput = null;

      // Same header + example row as the app's own "↓ Download template"
      // button in the Work Hub toolbar — kept identical so there's only one
      // canonical template file, regardless of where the user downloads it from.
      var DEMO_CSV = 'Date,Dept,Task Type,Title,Client,Assigned To,Due Date,Est Hrs,Platform,Doc URL,Deliverable URL,Remarks\n' +
        '2026-03-22,Social Media,Reel,JadeAlloys Product Reel,JadeAlloys,Aman,2026-03-25,2,Instagram,,https://drive.google.com/...,Client brief attached';

      function injectModal() {
        if (document.getElementById(MODAL_ID)) return;

        var html = '<div id="' + MODAL_ID + '" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:2147483647;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);">'
          + '<div style="background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.18);padding:26px 30px;max-width:460px;width:92%;max-height:85vh;overflow:auto;font-family:inherit;">'
          + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">'
          + '<span style="width:36px;height:36px;border-radius:50%;background:#F0FFF4;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;">📥</span>'
          + '<h3 style="margin:0;font-size:15px;font-weight:600;color:#111827;">Import Tasks from Excel/CSV</h3>'
          + '</div>'
          + '<p style="margin:0 0 10px;font-size:12px;color:#374151;line-height:1.5;">The first row of your file must be a header row with these column names (any order — matched by name, extra columns are ignored):</p>'
          + '<div style="background:#F8F9FA;border-radius:8px;padding:10px 12px;margin-bottom:12px;">'
          + '<code style="font-size:11px;color:#1f2937;line-height:1.8;display:block;word-break:break-word;">Date, Dept, Task Type, Title, Client, Assigned To, Due Date, Est Hrs, Platform, Doc URL, Deliverable URL, Remarks</code>'
          + '</div>'
          + '<ul style="margin:0 0 16px;padding-left:18px;font-size:11px;color:#6B7280;line-height:1.7;">'
          + '<li><strong>Title</strong> is required — rows without one are skipped.</li>'
          + '<li><strong>Dept</strong> should be one of: Social Media, Design, Ads, Web Dev.</li>'
          + '<li>Dates should be in YYYY-MM-DD format.</li>'
          + '<li>Not sure of the layout? Download the demo file below, fill it in, then upload it.</li>'
          + '</ul>'
          + '<button id="_wh-import-demo-btn" type="button" style="width:100%;margin-bottom:12px;padding:9px 14px;border-radius:8px;border:0.5px solid #3B6D1140;color:#27500A;background:#EAF3DE;font-size:12px;font-weight:500;cursor:pointer;">↓ Download Demo CSV</button>'
          + '<div style="display:flex;gap:10px;justify-content:flex-end;">'
          + '<button id="_wh-import-cancel-btn" type="button" style="padding:8px 18px;border-radius:8px;border:1px solid #D1D5DB;background:#fff;color:#374151;font-size:13px;font-weight:500;cursor:pointer;">Cancel</button>'
          + '<button id="_wh-import-choose-btn" type="button" style="padding:8px 18px;border-radius:8px;border:none;background:#217346;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">Choose File…</button>'
          + '</div>'
          + '</div>'
          + '</div>';
        document.body.insertAdjacentHTML('beforeend', html);

        document.getElementById('_wh-import-demo-btn').addEventListener('click', function () {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([DEMO_CSV], { type: 'text/csv' }));
          a.download = 'workhub-template.csv';
          a.click();
        });

        document.getElementById('_wh-import-cancel-btn').addEventListener('click', closeModal);

        document.getElementById(MODAL_ID).addEventListener('click', function (e) {
          if (e.target.id === MODAL_ID) closeModal();
        });

        document.getElementById('_wh-import-choose-btn').addEventListener('click', function () {
          var input = pendingInput;
          closeModal();
          // Direct call on the real <input type="file"> — target on the
          // resulting click event is the input itself, which the capture
          // listener below explicitly lets through (see "tagName==='INPUT'"
          // check), so this does not re-trigger the modal.
          if (input) input.click();
        });
      }

      function closeModal() {
        var m = document.getElementById(MODAL_ID);
        if (m) m.style.display = 'none';
        pendingInput = null;
      }

      function openModal(input) {
        injectModal();
        pendingInput = input;
        document.getElementById(MODAL_ID).style.display = 'flex';
      }

      document.addEventListener('click', function (evt) {
        // Let real file-input clicks through untouched — this includes the
        // synthetic click this same script fires from "Choose File…" above.
        if (evt.target.tagName === 'INPUT') return;

        var label = evt.target.closest('label');
        if (!label) return;
        if (label.textContent.indexOf('Import Excel/CSV') === -1) return;

        var input = label.querySelector('input[type="file"]');
        if (!input) return;

        // Stop the native label→input click forwarding so the file dialog
        // doesn't open before the user has seen the format modal.
        evt.preventDefault();
        evt.stopImmediatePropagation();
        openModal(input);
      }, true /* capture phase */);
    })();
  </script>

  <!-- ── Sticky Notes panel ────────────────────────────────────────────────
       Standalone, additive feature: a floating notes button (near the
       top-right user controls) + a slide-in panel for quick private
       per-user notes/reminders/ideas. Talks only to its own /api/notes

    ._dtn-btn-cancel:hover { background: #e2e8f0; }

    ._dtn-note { border: 1px solid #eef0f4; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: #fffdf5; }
    ._dtn-note-content { font-size: 12.5px; color: #1e293b; white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin: 0 0 8px; }
    ._dtn-note-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    ._dtn-note-ts { font-size: 10.5px; color: #94a3b8; }
    ._dtn-note-actions { display: flex; gap: 4px; flex-shrink: 0; }
    ._dtn-icon-btn { background: none; border: none; cursor: pointer; padding: 4px; border-radius: 5px; color: #94a3b8; display: flex; }
    ._dtn-icon-btn:hover { background: #f1f5f9; color: #475569; }
    ._dtn-icon-btn.danger:hover { background: #fef2f2; color: #dc2626; }

    ._dtn-empty { text-align: center; color: #94a3b8; font-size: 12.5px; padding: 30px 10px; }
  </style>

  <button id="_dt-notes-fab" type="button" title="Sticky Notes" aria-label="Sticky Notes">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3h9L20 8.5V19.5A1.5 1.5 0 0 1 18.5 21h-13A1.5 1.5 0 0 1 4 19.5v-15z"/>
      <path d="M14 3v4.5A1.5 1.5 0 0 0 15.5 9H20"/>
      <line x1="7.5" y1="12.5" x2="16.5" y2="12.5"/>
      <line x1="7.5" y1="16" x2="13.5" y2="16"/>
    </svg>
  </button>

  <div id="_dt-notes-panel">
    <div class="_dtn-header">
      <h3>🗒️ Sticky Notes</h3>
      <button class="_dtn-close" id="_dt-notes-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="_dtn-body" id="_dt-notes-body">
      <button class="_dtn-add-btn" id="_dt-notes-add-btn" type="button">+ New Note</button>
      <div id="_dt-notes-list"></div>
    </div>
  </div>

  <script>
    (function () {
      var API = '/api/notes';
      var fabEl, panelEl, listEl, addBtnEl, closeBtnEl;
      var notes = [];
      var loaded = false;
      var composing = false;
      var editingId = null;
      var lastUser = null;

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // Same identity the rest of the app resolves a user to (ownerName,
      // falling back to name — admin accounts have no ownerName).
      function getCurrentUser() {
        try {
          var raw = localStorage.getItem('seo_current_user');
          if (!raw) return null;
          var u = JSON.parse(raw);
          if (!u) return null;
          return (u.ownerName || u.name || '').trim() || null;
        } catch (e) { return null; }
      }

      function fmtTs(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d)) return '';
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        var h = d.getHours(), ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12; if (h === 0) h = 12;
        return d.getDate() + ' ' + months[d.getMonth()] + ' ' + pad(h) + ':' + pad(d.getMinutes()) + ' ' + ampm;
      }

      function f() { return window._origFetch || window.fetch.bind(window); }

      function renderList() {
        if (!listEl) return;
        var html = '';

        if (composing) {
          html += '<div class="_dtn-compose">' +
            '<textarea id="_dt-notes-new-text" placeholder="Write a note…"></textarea>' +
            '<div class="_dtn-compose-actions">' +
            '<button type="button" class="_dtn-btn _dtn-btn-cancel" id="_dt-notes-new-cancel">Cancel</button>' +
            '<button type="button" class="_dtn-btn _dtn-btn-save" id="_dt-notes-new-save">Save</button>' +
            '</div></div>';
        }

        if (!loaded) {
          html += '<div class="_dtn-empty">Loading…</div>';
        } else if (notes.length === 0 && !composing) {
          html += '<div class="_dtn-empty">No notes yet — click + New Note to add one.</div>';
        } else {
          notes.forEach(function (n) {
            if (editingId === n.id) {
              html += '<div class="_dtn-compose">' +
                '<textarea id="_dt-notes-edit-text" data-id="' + esc(n.id) + '">' + esc(n.content) + '</textarea>' +
                '<div class="_dtn-compose-actions">' +
                '<button type="button" class="_dtn-btn _dtn-btn-cancel" id="_dt-notes-edit-cancel">Cancel</button>' +
                '<button type="button" class="_dtn-btn _dtn-btn-save" id="_dt-notes-edit-save">Save</button>' +
                '</div></div>';
              return;
            }
            var updated = n.updatedAt && n.updatedAt !== n.createdAt;
            var tsLabel = (updated ? 'Updated ' : 'Created ') + fmtTs(updated ? n.updatedAt : n.createdAt);
            html += '<div class="_dtn-note">' +
              '<p class="_dtn-note-content">' + esc(n.content) + '</p>' +
              '<div class="_dtn-note-footer">' +
              '<span class="_dtn-note-ts">' + esc(tsLabel) + '</span>' +
              '<span class="_dtn-note-actions">' +
              '<button type="button" class="_dtn-icon-btn _dt-notes-edit-btn" data-id="' + esc(n.id) + '" title="Edit" aria-label="Edit">' +
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' +
              '</button>' +
              '<button type="button" class="_dtn-icon-btn danger _dt-notes-del-btn" data-id="' + esc(n.id) + '" title="Delete" aria-label="Delete">' +
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>' +
              '</button>' +
              '</span></div></div>';
          });
        }

        listEl.innerHTML = html;

        listEl.querySelectorAll('._dt-notes-edit-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            editingId = btn.getAttribute('data-id');
            composing = false;
            renderList();
          });
        });
        listEl.querySelectorAll('._dt-notes-del-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-id');
            if (window.confirm('Delete this note?')) deleteNote(id);
          });
        });

        if (composing) {
          var ta = document.getElementById('_dt-notes-new-text');
          if (ta) ta.focus();
          var addCancel = document.getElementById('_dt-notes-new-cancel');
          var addSave = document.getElementById('_dt-notes-new-save');
          if (addCancel) addCancel.addEventListener('click', function () { composing = false; renderList(); });
          if (addSave) addSave.addEventListener('click', saveNewNote);
        }
        if (editingId !== null) {
          var editTa = document.getElementById('_dt-notes-edit-text');
          if (editTa) editTa.focus();
          var editCancel = document.getElementById('_dt-notes-edit-cancel');
          var editSave = document.getElementById('_dt-notes-edit-save');
          if (editCancel) editCancel.addEventListener('click', function () { editingId = null; renderList(); });
          if (editSave) editSave.addEventListener('click', saveEditNote);
        }
      }

      function loadNotes() {
        var user = getCurrentUser();
        if (!user) { notes = []; loaded = true; renderList(); return; }
        loaded = false;
        renderList();
        f()(API + '?user=' + encodeURIComponent(user))
          .then(function (r) { return r.json(); })
          .then(function (data) {
            notes = Array.isArray(data) ? data : [];
            loaded = true;
            renderList();
          })
          .catch(function () {
            notes = [];
            loaded = true;
            renderList();
            window._showToast && window._showToast('Could not load notes', 'error');
          });
      }

      function saveNewNote() {
        var ta = document.getElementById('_dt-notes-new-text');
        var content = ta ? ta.value.trim() : '';
        var user = getCurrentUser();
        if (!content || !user) return;
        f()(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: user, content: content })
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (res.ok) {
              notes.unshift(res.data);
              composing = false;
              renderList();
            } else {
              window._showToast && window._showToast((res.data && res.data.error) || 'Failed to save note', 'error');
            }
          })
          .catch(function () { window._showToast && window._showToast('Network error — failed to save note', 'error'); });
      }

      function saveEditNote() {
        var ta = document.getElementById('_dt-notes-edit-text');
        var id = ta ? ta.getAttribute('data-id') : null;
        var content = ta ? ta.value.trim() : '';
        if (!id || !content) return;
        f()(API + '/' + encodeURIComponent(id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: content })
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (res.ok) {
              notes = notes.map(function (n) { return n.id === id ? res.data : n; })
                .sort(function (a, b) { return new Date(b.updatedAt) - new Date(a.updatedAt); });
              editingId = null;
              renderList();
            } else {
              window._showToast && window._showToast((res.data && res.data.error) || 'Failed to update note', 'error');
            }
          })
          .catch(function () { window._showToast && window._showToast('Network error — failed to update note', 'error'); });
      }

      function deleteNote(id) {
        f()(API + '/' + encodeURIComponent(id), { method: 'DELETE' })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (res.ok) {
              notes = notes.filter(function (n) { return n.id !== id; });
              renderList();
            } else {
              window._showToast && window._showToast((res.data && res.data.error) || 'Failed to delete note', 'error');
            }
          })
          .catch(function () { window._showToast && window._showToast('Network error — failed to delete note', 'error'); });
      }

      function openPanel() {
        panelEl.classList.add('open');
        fabEl.classList.add('open');
        if (!loaded) loadNotes();
      }
      function closePanel() {
        panelEl.classList.remove('open');
        fabEl.classList.remove('open');
        composing = false;
        editingId = null;
      }
      function togglePanel() {
        if (panelEl.classList.contains('open')) closePanel(); else openPanel();
      }

      // Show/hide the FAB as the logged-in user changes (e.g. login/logout);
      // polled rather than event-driven since "seo_current_user" is written
      // by the compiled React app, not by us.
      function syncVisibility() {
        var user = getCurrentUser();
        if (user !== lastUser) {
          lastUser = user;
          if (!user) {
            closePanel();
            notes = []; loaded = false;
          } else if (panelEl.classList.contains('open')) {
            loadNotes();
          }
        }
        fabEl.style.display = user ? 'flex' : 'none';
      }

      function start() {
        fabEl = document.getElementById('_dt-notes-fab');
        panelEl = document.getElementById('_dt-notes-panel');
        listEl = document.getElementById('_dt-notes-list');
        addBtnEl = document.getElementById('_dt-notes-add-btn');
        closeBtnEl = document.getElementById('_dt-notes-close');
        if (!fabEl || !panelEl) return;

        fabEl.addEventListener('click', togglePanel);
        closeBtnEl.addEventListener('click', closePanel);
        addBtnEl.addEventListener('click', function () {
          composing = true; editingId = null; renderList();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && panelEl.classList.contains('open')) closePanel();
        });

        lastUser = getCurrentUser();
        fabEl.style.display = lastUser ? 'flex' : 'none';
        setInterval(syncVisibility, 1500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
  </script>
</body>

</html>
